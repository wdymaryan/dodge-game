<script>
/* ===== Dodge engine: physics, level parsing, endless generator ===== */
const T_EMPTY = 0, T_SOLID = 1, T_ICE = 2, T_BOUNCE = 3, T_CRUMBLE = 4, T_SPIKE = 5, T_CONVR = 6, T_CONVL = 7, T_PULSE = 8, T_ORB = 9, T_VENT = 10, T_CANL = 11, T_CANR = 12, T_CAND = 13;
const CH2T = { '#': T_SOLID, i: T_ICE, b: T_BOUNCE, c: T_CRUMBLE, '^': T_SPIKE, e: T_CONVR, q: T_CONVL, x: T_PULSE, o: T_ORB, u: T_VENT, f: T_CANL, r: T_CANR, d: T_CAND };
const THEME_KEYS = ['dusk', 'concrete', 'harbor', 'neon', 'mint', 'ember', 'aurora', 'candy', 'void', 'toxic', 'frost'];
const PH = {
  g: 48, jump: 17.5, run: 8, accel: 75, iceAccel: 6, iceBrake: 3.5, airAccel: 48, fall: 24,
  slide: 4.5, wallVX: 9, wallVY: 16.5, wallLock: 0.17, coyote: 0.1, buffer: 0.12,
  bounce: 24.5, pw: 0.7, ph: 0.9, crumbleDelay: 0.45, liftRange: 5,
  conv: 4, ventUp: 9, ventAcc: 50, sawSpeed: 3.2, sawR: 0.42, pulseCycle: 2.4, pulseOn: 1.2, pulseWarn: 0.35, orbCd: 2.5, dashV: 24, dashTime: 0.2, dashCd: 0.35, bulletR: 0.2
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

}
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const pulseOnAt = tm => (tm % PH.pulseCycle) >= PH.pulseOn;
function defaultCfg() { return { theme: 'dusk', grav: 1, speed: 1, jumps: 1, wall: true, ms: 2.6, dash: true, bs: 6.5, bp: 2.4, dark: false, slick: false }; }

const y0idx = (sw, w, cx) => sw.y0 * w + cx;
function parseLevel(L) {
  const w = L.w, h = L.h, rows = L.rows;
  const t = new Uint8Array(w * h);
  let start = null, goal = null;
  const checks = [], movers = [], saws = [], cans = [];
  const cfg = Object.assign(defaultCfg(), L.cfg || {});

    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (CH2T[ch]) { t[y * w + x] = CH2T[ch]; if (ch === 'f' || ch === 'r' || ch === 'd') cans.push({ x, y, dir: ch, ph: ((x * 7 + y * 3) % 10) * 0.23, free: 0, speed: 6.5, P: 2.4 }); }
      else if (ch === 'S') start = { x, y };
      else if (ch === 'G') goal = { x, y };
      else if (ch === 'K') checks.push({ x, y });
      else if (ch === 'w') saws.push({ x0: x, y0: y, range: 0, axis: 'h', ph: ((x * 7 + y * 3) % 10) * 0.37 });
      else if (ch === 'v') saws.push({ x0: x, y0: y, range: 0, axis: 'v', ph: ((x * 7 + y * 3) % 10) * 0.37 });
    }
    let x = 0;
    while (x < w) {
      const ch = row[x];
      if (ch === 'm' || ch === 'n') {
        let x1 = x;
        while (x1 + 1 < w && row[x1 + 1] === ch) x1++;
        movers.push({ axis: ch === 'm' ? 'h' : 'v', x0: x, y0: y, w: x1 - x + 1, pos: 0, dir: 1, wait: 0.6, dx: 0, dy: 0 });
        x = x1 + 1;
      } else x++;
    }
  }
  for (const m of movers) {
    let free = 0;
    if (m.axis === 'h') {
      for (let cx = m.x0 + m.w; cx < w && free < 12; cx++) { if (t[m.y0 * w + cx] !== T_EMPTY) break; free++; }
    } else {
      for (let cy = m.y0 - 1; cy >= 0 && free < PH.liftRange; cy--) {
        let blocked = false;
        for (let cx = m.x0; cx < m.x0 + m.w; cx++) if (t[cy * w + cx] !== T_EMPTY) blocked = true;
        if (blocked) break;
        free++;
      }
    }
    m.range = free; m.speed = cfg.ms;
  }
  for (const sw of saws) {
    let f = 0;
    if (sw.axis === 'v') { for (let cy = sw.y0 - 1; cy >= 0 && f < 5; cy--) { if (t[cy * w + sw.x0] !== T_EMPTY || rows[cy][sw.x0] === 'v') break; f++; } }
    else { for (let cx = sw.x0 + 1; cx < w && f < 5; cx++) { if (t[y0idx(sw, w, cx)] !== T_EMPTY || rows[sw.y0][cx] === 'w') break; f++; } }
    sw.range = f;
  }
  const blocks = v => v === T_SOLID || v === T_ICE || v === T_BOUNCE || v === T_CONVR || v === T_CONVL || v === T_CRUMBLE || v === T_CANL || v === T_CANR || v === T_CAND;
  const canMap = new Map();
  for (const cn of cans) {
    let f = 0, cx = cn.x, cy = cn.y; const dx = cn.dir === 'f' ? -1 : cn.dir === 'r' ? 1 : 0, dy = cn.dir === 'd' ? 1 : 0;
    while (f < 16) { cx += dx; cy += dy; if (cx < 0 || cx >= w || cy >= h || blocks(t[cy * w + cx])) break; f++; }
    cn.free = f; cn.speed = cfg.bs; cn.P = cfg.bp; canMap.set(cn.y * w + cn.x, cn);

}

function validateLevel(L) {
  let s = 0, g = 0;
  for (const r of L.rows) for (const ch of r) { if (ch === 'S') s++; if (ch === 'G') g++; }
  if (s !== 1) return 'Place exactly one Start.';
  if (g !== 1) return 'Place exactly one Goal.';
  return null;
}
function levelHash(L) { return hashStr(L.rows.join('|') + JSON.stringify(L.cfg || {})); }

class Sim {
  constructor(level) {
    this.lv = parseLevel(level);
    this.cfg = this.lv.cfg;
    const s = this.lv.start || { x: 2, y: 2 };
    this.spawn = { x: s.x + 0.15, y: s.y + 1 - PH.ph - 0.001 };
    this.time = 0; this.deaths = 0; this.won = false; this.evs = [];
    this.respawn();
  }
  ev(n) { this.evs.push(n); }
  respawn() {
    this.x = this.spawn.x; this.y = this.spawn.y; this.vx = 0; this.vy = 0;
    this.grounded = false; this.onIce = false; this.standing = null; this.dead = false; this.deadT = 0;
    this.coyote = 0; this.buf = 0; this.wall = 0; this.wallSide = 0; this.wallT = 0; this.lock = 0;
    this.jumping = false; this.jumpsLeft = this.cfg.jumps - 1; this.face = 1; this.cr = new Map(); this.orbU = new Map(); this.conv = 0;
    this.dashes = 1; this.dashT = 0; this.dashCd = 0; this.dashing = false; this.dashDir = 1;
    if (this.cfg.chase) { const base = this.spawn.x - 7; this.grace = this.chaseX === undefined ? 3 : 1.5; this.chaseX = this.chaseX === undefined ? base : Math.min(this.chaseX, base); }
  }
  die() { if (this.dead) return; this.dead = true; this.deadT = 0.55; this.deaths++; this.ev('die'); }
  rect(m) {
    return { x: m.x0 + (m.axis === 'h' ? m.pos : 0), y: m.y0 - (m.axis === 'v' ? m.pos : 0), w: m.w, h: 0.6 };
  }
  solidT(tx, ty) {
    const lv = this.lv;
    if (tx < 0 || tx >= lv.w) return true;
    if (ty < 0 || ty >= lv.h) return false;
    const v = lv.t[ty * lv.w + tx];
    if (v === T_SOLID || v === T_ICE || v === T_BOUNCE || v === T_CONVR || v === T_CONVL || v === T_CANL || v === T_CANR || v === T_CAND) return true;
    if (v === T_CRUMBLE) { const c = this.cr.get(ty * lv.w + tx); return !(c !== undefined && c > PH.crumbleDelay); }
    return false;
  }
  typeAt(tx, ty) {
    const lv = this.lv;
    if (tx < 0 || tx >= lv.w || ty < 0 || ty >= lv.h) return 0;
    return lv.t[ty * lv.w + tx];
  }
  moveMover(m, dt) {
    if (m.range <= 0) { m.dx = m.dy = 0; return; }
    if (m.wait > 0) { m.wait -= dt; m.dx = m.dy = 0; return; }
    const before = m.pos;
    m.pos += m.dir * m.speed * dt;
    if (m.pos >= m.range) { m.pos = m.range; m.dir = -1; m.wait = 0.5; }
    else if (m.pos <= 0) { m.pos = 0; m.dir = 1; m.wait = 0.5; }
    const d = m.pos - before;
    m.dx = m.axis === 'h' ? d : 0; m.dy = m.axis === 'v' ? -d : 0;
  }
  step(dt, inp) {
    if (this.dead) { this.deadT -= dt; if (this.deadT <= 0) this.respawn(); return; }
    const lv = this.lv, c = this.cfg, E = 1e-4;
    this.time += dt;
    if (c.chase) { if (this.grace > 0) this.grace -= dt; else this.chaseX += c.chase * dt; if (this.x < this.chaseX) { this.die(); return; } }
    for (const m of lv.movers) this.moveMover(m, dt);
    if (this.standing) { this.x += this.standing.dx; this.y += this.standing.dy; }
    for (const [k, t] of this.orbU) { const nt = t - dt; if (nt <= 0) this.orbU.delete(k); else this.orbU.set(k, nt); }
    for (const [k, t] of this.cr) { const nt = t + dt; if (nt > 3.6) this.cr.delete(k); else this.cr.set(k, nt); }
    this.coyote -= dt; this.buf -= dt; this.wallT -= dt; this.lock -= dt; this.dashT -= dt; this.dashCd -= dt;
    if (inp.jp) this.buf = PH.buffer;
    const g = PH.g * c.grav;
    const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    if (this.dashing && this.dashT <= 0) { this.dashing = false; this.vx = this.dashDir * PH.run * c.speed; }
    if (inp.dp && c.dash !== false && !this.dashing && this.dashCd <= 0 && this.dashes > 0) {
      this.dashes--; this.dashing = true; this.dashT = PH.dashTime; this.dashCd = PH.dashTime + PH.dashCd;
      this.dashDir = dir || this.face; this.face = this.dashDir; this.vy = 0; this.lock = 0; this.jumping = false; this.buf = 0; this.ev('dash');
    }
    if (this.lock <= 0 && !this.dashing) {
      const tgt = dir * PH.run * c.speed;
      let rate;
      if (this.grounded && (this.onIce || c.slick)) rate = dir ? PH.iceAccel : PH.iceBrake;
      else rate = this.grounded ? PH.accel : PH.airAccel;
      this.vx = approach(this.vx, tgt, rate * dt);
    }
    if (dir) this.face = dir;
    this.vy = Math.min(PH.fall, this.vy + g * dt);
    if (this.typeAt(Math.floor(this.x + PH.pw / 2), Math.floor(this.y + PH.ph / 2)) === T_VENT) { this.vy = Math.max(-PH.ventUp, this.vy - (g + PH.ventAcc) * dt); this.jumping = false; this.inVent = true; } else this.inVent = false;
    if (this.wall !== 0 && !this.grounded && this.vy > PH.slide && !this.inVent) this.vy = PH.slide;
    if (this.buf > 0 && !this.dashing) {
      if (this.coyote > 0) {
        this.vy = -PH.jump; this.coyote = 0; this.buf = 0; this.grounded = false; this.jumping = true; this.ev('jump');
      } else if (this.wallT > 0 && c.wall) {
        this.vy = -PH.wallVY; this.vx = -this.wallSide * PH.wallVX; this.lock = PH.wallLock;
        this.wallT = 0; this.buf = 0; this.jumping = false; this.jumpsLeft = c.jumps - 1;
        this.face = -this.wallSide; this.ev('walljump');
      } else if (this.jumpsLeft > 0) {
        this.vy = -PH.jump * 0.9; this.jumpsLeft--; this.buf = 0; this.jumping = true; this.ev('djump');
      }
    }
    if (!inp.jh && this.jumping && this.vy < -5.5) { this.vy = -5.5; this.jumping = false; }
    if (this.vy >= 0) this.jumping = false;
    if (this.dashing) { this.vx = this.dashDir * PH.dashV; this.vy = 0; }

    const pw = PH.pw, ph = PH.ph;
    // horizontal
    const mvx = this.vx + this.conv;
    this.x += mvx * dt;
    {
      const y0 = Math.floor(this.y), y1 = Math.floor(this.y + ph - 1e-6);
      if (mvx > 0) {
        const tx = Math.floor(this.x + pw);
        for (let ty = y0; ty <= y1; ty++) if (this.solidT(tx, ty)) { this.x = tx - pw - E; this.vx = 0; break; }
      } else if (mvx < 0) {
        const tx = Math.floor(this.x);
        for (let ty = y0; ty <= y1; ty++) if (this.solidT(tx, ty)) { this.x = tx + 1 + E; this.vx = 0; break; }
      }
      for (const m of lv.movers) {
        const r = this.rect(m);
        if (this.x + pw > r.x + 0.01 && this.x < r.x + r.w - 0.01 && this.y + ph > r.y + 0.08 && this.y < r.y + r.h - 0.05) {
          if (this.x + pw / 2 < r.x + r.w / 2) this.x = r.x - pw - E; else this.x = r.x + r.w + E;
          this.vx = 0;
        }
      }
    }
    // vertical
    const prevBottom = this.y + ph;
    this.y += this.vy * dt;
    {
      const x0 = Math.floor(this.x + 1e-6), x1 = Math.floor(this.x + pw - 1e-6);
      if (this.vy > 0) {
        const ty = Math.floor(this.y + ph);
        for (let tx = x0; tx <= x1; tx++) if (this.solidT(tx, ty) && prevBottom <= ty + 1e-3 + 0.05) { this.y = ty - ph - E; this.vy = 0; break; }
      } else if (this.vy < 0) {
        const ty = Math.floor(this.y);
        for (let tx = x0; tx <= x1; tx++) if (this.solidT(tx, ty)) { this.y = ty + 1 + E; this.vy = 0; this.jumping = false; break; }
      }
      for (const m of lv.movers) {
        const r = this.rect(m);

  sawPos(sw) {

  bulletPos(cn) {

  probe() {
    const lv = this.lv, pw = PH.pw, ph = PH.ph;
    const bottom = this.y + ph;
    const rowBelow = Math.floor(bottom + 0.06);
    const xa = Math.floor(this.x + 0.05), xb = Math.floor(this.x + pw - 0.05);
    const wasGround = this.grounded;
    let ground = false, ice = false, bounce = false, stand = null, conv = 0;
    const gap = rowBelow - bottom;
    if (this.vy >= 0 && gap <= 0.1 && gap >= -0.15) {
      for (let tx = xa; tx <= xb; tx++) {
        if (this.solidT(tx, rowBelow)) {
          ground = true;
          const tp = this.typeAt(tx, rowBelow);
          if (tp === T_ICE) ice = true;
          if (tp === T_BOUNCE) bounce = true;
          if (tp === T_CONVR) conv = PH.conv; else if (tp === T_CONVL) conv = -PH.conv;

        }
      }
    }
    if (!ground && this.vy >= -0.01) {
      for (const m of lv.movers) {
        const r = this.rect(m);
        if (this.x + pw > r.x + 0.02 && this.x < r.x + r.w - 0.02 && Math.abs(bottom - r.y) < 0.12) { ground = true; stand = m; break; }
      }
    }

    this.grounded = ground; this.onIce = ice; this.conv = ground && !stand ? conv : 0;
    if (ground) {
      this.coyote = PH.coyote; this.jumpsLeft = this.cfg.jumps - 1; if (!this.dashing) this.dashes = 1;
      if (!wasGround) this.ev('land');
      if (bounce) { this.vy = -PH.bounce; this.grounded = false; this.coyote = 0; this.jumping = false; this.ev('bounce'); }
    }
    // walls
    this.wall = 0;
    if (!this.grounded) {
      const ya = Math.floor(this.y + 0.2), yb = Math.floor(this.y + ph - 0.2);
      const lx = Math.floor(this.x - 0.08), rx = Math.floor(this.x + pw + 0.08);
      for (let ty = ya; ty <= yb; ty++) {
        if (this.solidT(rx, ty)) { this.wall = 1; break; }

      }
      if (this.wall) { this.wallSide = this.wall; this.wallT = 0.1; }

    case 'b': body(th.tile); ctx.fillStyle = ACCENT; ctx.fillRect(x + s * 0.05, y + s * 0.02, s * 0.9, s * 0.4);
      ctx.fillStyle = 'rgba(0,0,0,.28)'; for (let i = 0; i < 3; i++) ctx.fillRect(x + s * (0.15 + i * 0.27), y + s * 0.16, s * 0.14, s * 0.1); break;

function drawFlag(ctx, x, y, s, color, wave, tall) {

/* ===== game stage ===== */
const G = {
  active: false, canvas: null, ctx: null, W: 0, H: 0, dpr: 1, tile: 24, sim: null, level: null, sess: null,
  cam: { x: 0, y: 0 }, parts: [], squash: 0, acc: 0, last: 0, t: 0, keys: { l: 0, r: 0, j: 0, d: 0 }, jp: false, dp: false, flash: 0, raf: 0, ovlTimer: 0, lastTick: -1, shake: 0
};
function stageInit() {
  G.canvas = $('#game'); G.ctx = G.canvas.getContext('2d');
  const hold = (id, key) => {
    const b = $(id); const on = e => { e.preventDefault(); b.classList.add('on'); G.keys[key] = 1; if (key === 'j') G.jp = true; if (key === 'd') G.dp = true; try { b.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } };
    const off = e => { e.preventDefault(); b.classList.remove('on'); G.keys[key] = 0; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  };
  hold('#bL', 'l'); hold('#bR', 'r'); hold('#bJ', 'j'); hold('#bD', 'd');
  const kmap = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'j', w: 'j', W: 'j', ' ': 'j', z: 'j', Z: 'j', Shift: 'd', x: 'd', X: 'd' };
  addEventListener('keydown', e => { if (!G.active) return; const k = kmap[e.key]; if (k) { e.preventDefault(); if (k === 'j' && !G.keys.j) G.jp = true; if (k === 'd' && !G.keys.d) G.dp = true; G.keys[k] = 1; } if (e.key === 'Escape') stageLeave(); });
  addEventListener('keyup', e => { const k = kmap[e.key]; if (k) G.keys[k] = 0; });
  addEventListener('resize', () => { if (G.active) stageSize(); });
  addEventListener('blur', () => { G.keys.l = G.keys.r = G.keys.j = G.keys.d = 0; });
}
function stageSize() {
  const cv = $('#stage .cv'); const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(200, cv.clientWidth), H = Math.max(160, cv.clientHeight);
  G.W = W; G.H = H; G.dpr = dpr; G.canvas.width = Math.round(W * dpr); G.canvas.height = Math.round(H * dpr);
  G.canvas.style.width = W + 'px'; G.canvas.style.height = H + 'px';
  G.tile = Math.round(clamp(Math.max(W / 14, H / 24), 20, 44));
}
function stageOpen(sess) {
  G.sess = sess; sess.deaths = 0; sess.flawless = 0; G.active = true; $('#stage').hidden = false; document.body.classList.add('staged');
  stageSize(); G.parts.length = 0; G.keys.l = G.keys.r = G.keys.j = G.keys.d = 0; G.jp = false; G.flash = 0;
  $('#hLab').textContent = sess.mode === 'run' ? 'LEVEL' : sess.mode === 'warm' ? 'WARM-UP' : sess.mode === 'test' ? 'TEST' : 'LEVEL';
  stageLoad(sess.nextLevel());

function stageClose() {

function stageLoad(L) {

function setOvl(html, ms) {

function stageLeave() {

    if (G.confirming) return; G.confirming = true;

function stageFrame(ts) {
  if (!G.active) return;

  const s = G.sess, sim = G.sim;

      paused = true;
      const left = Math.ceil((s.startedAt - now) / 1000);

    } else if ($('#ovl').dataset.keep === '1') { $('#ovl').dataset.keep = '0'; setOvl('GO!', 700); sfx.go(); G.lastTick = -1; }

    if (s.over) paused = true;

  }

      G.jp = false;

  stageCamera(dt); stageDraw(dt);
  G.raf = requestAnimationFrame(stageFrame);
}
function stageEvent(ev) {
  const sim = G.sim, cx = sim.x + PH.pw / 2, fy = sim.y + PH.ph;
  const dust = (n, vx, vy, col = 'rgba(255,255,255,.7)') => { for (let i = 0; i < n; i++) G.parts.push({ x: cx + (Math.random() - .5) * .5, y: fy, vx: (Math.random() - .5) * 3 + vx, vy: -Math.random() * 2 + vy, life: .4 + Math.random() * .2, max: .6, c: col, s: .12 + Math.random() * .1 }); };
  if (ev === 'jump') { dust(4, 0, 0); sfx.jump(); G.squash = -0.18; }
  else if (ev === 'djump') { dust(6, 0, 1); sfx.jump(); }
  else if (ev === 'walljump') { dust(6, -sim.face * 2, 0); sfx.wall(); }
  else if (ev === 'land') { dust(5, 0, 0); sfx.land(); G.squash = 0.2; }
  else if (ev === 'bounce') { dust(10, 0, 2, 'rgba(255,160,60,.9)'); sfx.bounce(); G.squash = -0.3; }
  else if (ev === 'die') {
    STATS.deaths++; saveStats(); if (G.sess) { G.sess.deaths++; stageHud(); } G.flash = 1; G.shake = 0.35; sfx.die(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { /* no haptics */ }
    for (let i = 0; i < 22; i++) { const a = Math.random() * 6.28, sp = 2 + Math.random() * 6; G.parts.push({ x: cx, y: sim.y + .45, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: .7, max: .7, c: sim.champ ? GOLD : ACCENT, s: .16 }); }
  }
  else if (ev === 'orb') { dust(8, 0, -1, 'rgba(143,239,255,.9)'); beep(880, 0.09, 'sine', 0.05, 300); G.squash = -0.15; }
  else if (ev === 'check') { toast('Checkpoint'); sfx.tick(); }
  else if (ev === 'crumble') beep(150, 0.1, 'triangle', 0.03);
  else if (ev === 'dash') {
    STATS.dashes++; beep(520, 0.14, 'sawtooth', 0.04, -320);
    for (let i = 0; i < 8; i++) G.parts.push({ x: cx - sim.dashDir * Math.random() * 0.6, y: sim.y + Math.random() * PH.ph, vx: -sim.dashDir * (2 + Math.random() * 3), vy: (Math.random() - 0.5) * 1.5, life: 0.3, max: 0.3, c: 'rgba(143,239,255,.9)', s: 0.14 });
  }
}
function stageWin() {

async function recordRun(dur, n, reached) {
  const ref = NET.db.doc('scores/' + NET.uid); const snap = await ref.get(); const cur = snap.exists ? snap.data() : {};
  const d = dayKey(), k = String(dur), now = Date.now();
  const best = Object.assign({}, cur.best); if (!best[k] || n > best[k].n) best[k] = { n, at: now };
  const today = cur.today && cur.today.d === d ? Object.assign({}, cur.today) : { d };
  if (!today[k] || n > today[k].n) today[k] = { n, at: now };
  const prevLevel = Math.max(1, Number(cur.level) || 1);

function levelBoardRows() {
  const rows = [];

    const level = Math.max(Number(p.level) || 0, legacyBest ? legacyBest + 1 : 0);
    const totalCleared = Number(p.totalCleared) || legacyBest;
    if (level > 1 || totalCleared > 0 || (p.runs || 0) > 0) {
      rows.push({ uid: p.uid, nick: p.nick || 'Player', level: Math.max(1, level), totalCleared, at: p.levelAt || (p.recent && p.recent[0] && p.recent[0].at) || 0, runs: p.runs || 0, recent: p.recent || [] });
    }
  }
  return rows.sort((a, b) => (b.level - a.level) || (b.totalCleared - a.totalCleared) || (a.at - b.at));
}

  const k = String(dur), d = dayKey(), rows = [];

function edTemplate(w, h) {
  const g = [];

  g[h - 6][3] = 'S'; g[h - 6][w - 4] = 'G';
  for (let x = 14; x < 18; x++) for (let y = h - 5; y < h; y++) g[y][x] = '.';

}
function edNew() {
  Object.assign(ED, { id: newId(), name: 'My level', w: 48, h: 20, cfg: defaultCfg(), verified: null, undo: [], redo: [], tool: '#', tile: 26 });

  edSave(true); buildRender();
}
function edLoad(L) {

  ED.cam = { x: 0, y: 0 }; ED.open = true; ED.mounted = false; buildRender();
}
const edRows = () => ED.grid.map(r => r.join(''));
const edLevel = () => ({ name: ED.name, w: ED.w, h: ED.h, rows: edRows(), cfg: Object.assign({}, ED.cfg) });

const edVerified = () => ED.verified !== null && ED.verified === edHash();
function edSave(silent) {

  const rec = Object.assign({}, prev, L, { id: ED.id, at: Date.now(), ver: edVerified() ? edHash() : null });

function edRedo() { if (!ED.redo.length) return; ED.undo.push(edRows()); edRestore(ED.redo.pop()); }
function edSet(x, y, ch) {
  if (x < 0 || y < 0 || x >= ED.w || y >= ED.h) return false;
  if (ED.grid[y][x] === ch) return false;
  if (!ED.stroke.pushed) { edPush(); ED.stroke.pushed = true; }
  if (ch === 'S' || ch === 'G') { for (let yy = 0; yy < ED.h; yy++) for (let xx = 0; xx < ED.w; xx++) if (ED.grid[yy][xx] === ch) ED.grid[yy][xx] = '.'; }
  ED.grid[y][x] = ch; ED.stroke.changed = true; return true;
}
function edResize(nw, nh) {
  nw = clamp(nw, 16, 120); nh = clamp(nh, 12, 30);
  if (nw === ED.w && nh === ED.h) return; edPush();
  const g = ED.grid;
  while (ED.h < nh) { g.unshift(new Array(ED.w).fill('.')); ED.h++; }
  while (ED.h > nh) { g.shift(); ED.h--; }
  while (ED.w < nw) { for (let y = 0; y < ED.h; y++) { const c = g[y][ED.w - 1]; g[y].push(c === '#' || c === 'i' ? c : '.'); } ED.w++; }
  while (ED.w > nw) { for (let y = 0; y < ED.h; y++) g[y].pop(); ED.w--; }

  el.textContent = err ? err : edVerified() ? 'Cleared by you. Ready to publish.' : 'Not cleared yet. Test it to unlock publishing.';

function isPublished(id) {
  const mine = NET.levels.find(d => d.uid === NET.uid); return !!(mine && mine.items && mine.items[id]);
}

  x.fillStyle = '#1d2030'; x.fillRect(0, 0, 64, 64);
  if (ch === 'hand') { x.strokeStyle = '#eceef2'; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(32, 12); x.lineTo(32, 52); x.moveTo(12, 32); x.lineTo(52, 32); x.moveTo(26, 18); x.lineTo(32, 12); x.lineTo(38, 18); x.moveTo(26, 46); x.lineTo(32, 52); x.lineTo(38, 46); x.moveTo(18, 26); x.lineTo(12, 32); x.lineTo(18, 38); x.moveTo(46, 26); x.lineTo(52, 32); x.lineTo(46, 38); x.stroke(); }
  else if (ch === '.') { x.fillStyle = '#eceef2'; x.fillRect(14, 22, 36, 22); x.fillStyle = '#ff7a1a'; x.fillRect(14, 22, 14, 22); }

function toolKey(k) { return k === 'erase' ? '.' : k; }
function edSizeCanvas() {
  if (!ED.canvas) return; const box = $('#edcv'); const dpr = Math.min(2, devicePixelRatio || 1);
  const w = box.clientWidth || 320, h = Math.round(clamp(innerHeight * (innerWidth >= 900 ? 0.55 : 0.42), 240, 640));
  ED.canvas.width = w * dpr; ED.canvas.height = h * dpr; ED.canvas.style.width = w + 'px'; ED.canvas.style.height = h + 'px'; ED.dpr = dpr; ED.cw = w; ED.ch = h;
  edClamp(); edDraw();

function edClamp() {

  ED.cam.y = ED.h <= vh ? (ED.h - vh) / 2 : clamp(ED.cam.y, -2, ED.h - vh + 2);

function edDraw() {
  if (!ED.open || !ED.ctx || !ED.cw) return;
  const ctx = ED.ctx, tp = ED.tile, th = THEMES[ED.cfg.theme] || THEMES.dusk; ctx.setTransform(ED.dpr, 0, 0, ED.dpr, 0, 0);
  const gr = ctx.createLinearGradient(0, 0, 0, ED.ch); gr.addColorStop(0, th.skyT); gr.addColorStop(1, th.skyB); ctx.fillStyle = gr; ctx.fillRect(0, 0, ED.cw, ED.ch);

  for (let y = 0; y <= ED.h; y++) { const py = Math.round(oy + y * tp) + .5; ctx.moveTo(ox, py); ctx.lineTo(ox + ED.w * tp, py); }

      else { ED.stroke = { last: edCell(e), pushed: false, changed: false }; const t = toolKey(ED.tool); if (edSet(ED.stroke.last.x, ED.stroke.last.y, t)) requestEdDraw(); }

  $$('#edTools .tool').forEach(b => { const on = toolKey(b.dataset.t) === t; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });

ACT.edClear = async () => {

  edPush(); ED.grid = edTemplate(ED.w, ED.h).map(r => r.map(() => '.')); ED.grid[ED.h - 3][3] = 'S'; ED.grid[ED.h - 3][ED.w - 4] = 'G';

  const err = validateLevel(edLevel()); if (err) { toast(err, 'bad'); return; }
  edSave(true); const L = edLevel(); const h = levelHash(L);
  stageOpen({ mode: 'test', n: 1, cleared: 0, elapsed: 0, won: false, level: L, hash: h, nextLevel() { return L; } });

  setTimeout(() => { if (G.sess === s) { stageClose(); G.sess = null; goView('build'); toast('Cleared. You can publish this level now.', 'good'); } }, 1200);

ACT.edPublish = async () => {
  if (!online()) { toast('Publishing needs a signed-in view', 'bad'); return; }
  if (!edVerified()) { toast('Clear your level first', 'bad'); return; }
  if (!NET.nick) { if (!(await askNick())) return; }
  const L = edLevel(); const id = ED.id;
  try {
    await serial('l', async () => {
      const ref = NET.db.doc('levels/' + NET.uid); const snap = await ref.get(); const cur = snap.exists ? snap.data() : {};
      const items = Object.assign({}, cur.items);
      if (!items[id] && Object.keys(items).length >= 20) throw { code: 'limit' };
      items[id] = { name: L.name || 'Untitled', w: L.w, h: L.h, rows: L.rows, cfg: L.cfg, at: Date.now(), verified: true };
      await ref.set({ uid: NET.uid, nick: NET.nick, items });
    });
    sfx.clear(); toast('Published. It can show up as level 5 in runs.', 'good'); edStat();
  } catch (e) { toast(e && e.code === 'limit' ? 'You can share up to 20 levels' : 'Couldn’t publish. Try again.', 'bad'); }

  if (!online()) return;
  try {
    await serial('l', async () => {
      const ref = NET.db.doc('levels/' + NET.uid); const snap = await ref.get(); if (!snap.exists) return;
      const cur = snap.data(); const items = Object.assign({}, cur.items); delete items[id];
      await ref.set({ uid: NET.uid, nick: NET.nick || cur.nick, items });

  } catch (e) { toast('Couldn’t remove it. Try again.', 'bad'); }

    <div class="fld"><label>Theme</label><div class="chips">${THEME_KEYS.map(k => `<button class="chip ${ED.cfg.theme === k ? 'on' : ''}" data-set="theme" data-val="${k}"><i style="background:linear-gradient(${THEMES[k].skyT},${THEMES[k].skyB})"></i>${THEMES[k].name}</button>`).join('')}</div></div>
    <div class="fld"><label>Size</label><div class="steps"><div><span>Width ${ED.w}</span><button class="btn sm" data-size="w-8">−</button><button class="btn sm" data-size="w+8">+</button></div><div><span>Height ${ED.h}</span><button class="btn sm" data-size="h-2">−</button><button class="btn sm" data-size="h+2">+</button></div></div></div>
    ${seg('grav', 'Gravity')}${seg('speed', 'Run speed')}${seg('jumps', 'Jumps in the air')}${seg('wall', 'Wall jumps')}${seg('ms', 'Mover speed')}${seg('dash', 'Dash')}${seg('bs', 'Bullet speed')}${seg('dark', 'Blackout')}${seg('slick', 'All ice')}
    <p class="dim sm">Changing physics or tiles means you need to clear the level again before publishing.</p>
    <div class="row end"><button class="btn primary" data-x="c">Done</button></div>`;
}
ACT.edSettings = () => {
  const m = openModal(sheetHtml());
  const sheet = $('.sheet', m.el);
  m.el.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) { m.close(); edSave(true); edStat(); return; }
    const s = e.target.closest('[data-set]'), z = e.target.closest('[data-size]');
    if (s) { const k = s.dataset.set; let v = s.dataset.val; v = k === 'theme' ? v : v === 'true' ? true : v === 'false' ? false : +v; ED.cfg[k] = v; }
    if (z) { const [ax, op, n] = z.dataset.size.match(/([wh])([+-])(\d+)/).slice(1); const d = (op === '+' ? 1 : -1) * +n; edResize(ax === 'w' ? ED.w + d : ED.w, ax === 'h' ? ED.h + d : ED.h); }
    if (s || z) { sheet.innerHTML = sheetHtml(); edDraw(); edStat(); }
  });
};

/* ---- my levels list ---- */
function buildListHtml() {
  const list = mineList();
  const cards = list.map(L => {
    const pub = isPublished(L.id), ver = L.ver && L.ver === levelHash(L);
    WORLD['m' + L.id] = L;
    return `<article class="lv"><img alt="Preview of ${esc(L.name)}" src="${previewUrl(L)}"><div class="lvb">
      <div class="lvt">${esc(L.name || 'Untitled')}</div>
      <div class="row gap wrap"><span class="tag ${pub ? 'good' : ver ? 'ice' : ''}">${pub ? 'Published' : ver ? 'Cleared' : 'Draft'}</span><span class="dim sm">${L.w}×${L.h} · ${esc((THEMES[(L.cfg || {}).theme] || THEMES.dusk).name)}</span></div>
      <div class="row gap wrap"><button class="btn sm primary" data-act="myEdit" data-id="${esc(L.id)}">Edit</button><button class="btn sm" data-act="myPlay" data-id="${esc(L.id)}">Play</button>${pub ? `<button class="btn sm" data-act="myUnpub" data-id="${esc(L.id)}">Unpublish</button>` : ''}<button class="btn sm ghost" data-act="myDel" data-id="${esc(L.id)}">Delete</button></div></div></article>`;
  }).join('');
  return `<div class="sectionhead"><h2>Build</h2><p class="dim">Paint tiles, set the physics, pick a theme and size. Clear your own level once and you can share it. Dying in a run never costs you your place, so build while you wait.</p></div>
    <div class="row gap wrap"><button class="btn primary big" data-act="edNew">New level</button></div>
    ${list.length ? `<div class="lvgrid">${cards}</div>` : `<div class="card empty"><h3>Nothing built yet</h3><p class="dim">Your levels are saved on this device as you edit.</p></div>`}`;
}
ACT.edNew = () => edNew();
ACT.myEdit = el => { const L = mineList().find(x => x.id === el.dataset.id); if (L) edLoad(L); };
ACT.myPlay = el => { const L = mineList().find(x => x.id === el.dataset.id); if (!L || G.active) return; stageOpen({ mode: 'level', n: 1, cleared: 0, elapsed: 0, level: L, nextLevel() { return L; } }); };
ACT.myUnpub = el => unpublish(el.dataset.id);
ACT.myDel = async el => {
  const id = el.dataset.id;
  if (!(await askConfirm('Delete this level?', 'It is removed from this device and from community levels.', 'Delete', true))) return;
  saveMine(mineList().filter(x => x.id !== id)); if (isPublished(id)) unpublish(id); buildRender();
};

/* ---- in-line banner ---- */
function renderLineBar() {
  const b = $('#lineBar'); if (!b) return; const pos = myPos();
  const show = online() && NET.inLine && pos >= 0 && VIEW !== 'play' && !G.active;
  b.hidden = !show; if (!show) return;
  b.innerHTML = `<span><b>#${pos + 1}</b> in line, about <b data-clock="eta2">${fmt(etaMs(pos))}</b></span><button class="btn sm" data-act="view" data-v="play">Open</button>`;
}

/* editor keyboard shortcuts (desktop) */
addEventListener('keydown', ev => {
  if (!ED.open || VIEW !== 'build' || G.active || document.querySelector('.modal')) return;
  const t = ev.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); ev.shiftKey ? edRedo() : edUndo(); edSave(true); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); edRedo(); edSave(true); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const n = parseInt(ev.key, 10);
  const order = ['hand', '#', 'i', 'b', 'c', '^', 'm', 'n', 'K', 'S', 'G', '.'];
  let tool = null;
  if (n >= 1 && n <= 9) tool = order[n]; else if (ev.key === '0') tool = '.'; else if (k === 'h') tool = 'hand'; else if (k === 'e') tool = '.';
  if (tool) { const b = document.querySelector('#edTools .tool[data-t="' + (tool === '.' ? 'erase' : tool) + '"]'); if (b) ACT.edTool(b); }
  if (k === '=' || k === '+') ACT.edZoom({ dataset: { d: '1' } }); if (k === '-') ACT.edZoom({ dataset: { d: '-1' } });
  if (k === 't') ACT.edTest();
});

/* ===== boot ===== */
(function () {
  stageInit();
  const v = LS.get('view', 'play');
  goView(['play', 'build', 'comm', 'ranks'].includes(v) ? v : 'play');
  renderNow();
  netInit();
})();

</script>

</body></html>
