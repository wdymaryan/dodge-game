<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dodge</title>
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#dcdfe4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='22' width='12' height='8' fill='%2314171d'/%3E%3Crect x='18' y='14' width='12' height='16' fill='%2314171d'/%3E%3Crect x='9' y='6' width='8' height='8' rx='2' fill='%23ff6a13'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout concept: a timing board on poured concrete. Condensed numerals, painted hazard lane, one orange. */
:root {
  --bg: #dcdfe4; --panel: #eef0f3; --panel2: #e3e6ea; --ink: #14171d; --dim: #566070; --line: #bfc5ce;
  --accent: #ff6a13; --accent-ink: #1c0c02; --gold: #d9a000; --ice: #1f7ed1; --good: #1c8f52; --bad: #cf3446;
  --master: #6d4aff;
  --stage: #10131a; --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(20,23,29,.12);
  --f-disp: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif; --f-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181e; --panel: #1e222a; --panel2: #262b34; --ink: #eceef2; --dim: #9aa3b2; --line: #343a46;
  --accent: #ff7a1a; --accent-ink: #1c0c02; --gold: #ffc83d; --ice: #6db4ff; --good: #4ade80; --bad: #ff6677;
  --master: #9c82ff;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #1e222a; --panel2: #262b34; --ink: #eceef2; --dim: #9aa3b2; --line: #343a46;
  --accent: #ff7a1a; --accent-ink: #1c0c02; --gold: #ffc83d; --ice: #6db4ff; --good: #4ade80; --bad: #ff6677;
  --master: #9c82ff;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 84px; }
body.staged { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; text-wrap: balance; }
h2 { font-size: 30px; font-weight: 800; } h3 { font-size: 22px; font-weight: 700; }
p { margin: 0; } .dim { color: var(--dim); } .sm { font-size: 13px; }
b { font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
.wrapper { max-width: 640px; margin: 0 auto; }

.top { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
.logo { font-family: var(--f-disp); font-weight: 800; font-size: 26px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.logo svg { width: 26px; height: 26px; flex: none; }
.chipbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 18px; height: 18px; } .iconbtn.off { opacity: .55; }
.lane { height: 8px; max-width: 640px; margin: 0 auto 14px; background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--ink) 12px 24px); border-radius: 2px; opacity: .9; }
.view { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none !important; }
.sectionhead { display: flex; flex-direction: column; gap: 6px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; } .card.off { background: var(--panel2); border-style: dashed; } .card.empty { align-items: flex-start; }
.card.relay-hero { border-color: var(--ice); background: color-mix(in srgb, var(--ice) 8%, var(--panel)); }
.eyebrow { font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 14px; color: var(--dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
.dot.warn { background: var(--gold); }
@keyframes pulse { 50% { opacity: .25; } }
.now.live { border-color: var(--accent); }
.now.disconnected { border-color: var(--bad); }
.grace-bar { background: color-mix(in srgb, var(--bad) 14%, var(--panel2)); border: 1px solid var(--bad); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grace-bar b { font-family: var(--f-disp); font-size: 20px; color: var(--bad); font-variant-numeric: tabular-nums; }
.nowrow { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.nowrow > div:first-child { flex: 1 1 140px; min-width: 0; }
.nm { font-family: var(--f-disp); font-weight: 800; font-size: 32px; line-height: 1.02; text-transform: uppercase; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.digits { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.digits b { font-family: var(--f-disp); font-weight: 800; font-size: 44px; line-height: .95; }
.digits span { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; } .meter i { display: block; height: 100%; background: var(--accent); transition: width .4s linear; }
.posrow { display: flex; align-items: center; gap: 16px; } .pos { font-family: var(--f-disp); font-weight: 800; font-size: 64px; line-height: .9; color: var(--accent); }
.posrow b { font-family: var(--f-disp); font-size: 28px; font-variant-numeric: tabular-nums; }
.qlist, .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.qlist li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); } .qlist li:first-child { border-top: 0; }
.qn { font-family: var(--f-disp); font-weight: 800; font-size: 22px; width: 26px; color: var(--dim); font-variant-numeric: tabular-nums; }
.qname { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px; } .qlist li.me .qname { color: var(--accent); }
.tag { font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; padding: 2px 7px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.tag.gold { color: var(--accent-ink); background: var(--gold); border-color: transparent; } .tag.good { color: var(--good); border-color: var(--good); } .tag.ice { color: var(--ice); border-color: var(--ice); } .tag.accent { color: var(--accent-ink); background: var(--accent); border-color: transparent; } .tag.bad { color: #fff; background: var(--bad); border-color: transparent; }
.champ { flex-direction: row; align-items: center; gap: 14px; } .champ .nm { font-size: 28px; }
.crown { width: 20px; height: 15px; color: var(--gold); flex: none; } .crown.sm { width: 18px; height: 14px; display: inline-block; vertical-align: -1px; } .crown.lg { width: 56px; height: 42px; } .crown.dim { color: var(--line); }
.how summary { cursor: pointer; font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 15px; }
.how ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--dim); }
.lvpick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lvpick .btn.sm.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lvpick select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-weight: 600; min-height: 38px; }
.modebar { display: flex; flex-direction: column; gap: 8px; }
.mode-desc { font-size: 13px; color: var(--dim); }
.tbadge { font-family: var(--f-disp); font-weight: 800; font-size: 12px; letter-spacing: .08em; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--gold) 22%, var(--panel2)); border: 1px solid var(--gold); color: var(--ink); vertical-align: middle; }

/* In-game clutch callout plate */
#clutchPop { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cpop { background: rgba(16,19,26,.94); border: 1px solid #3a4152; border-left: 4px solid var(--gold); color: #fff; padding: 7px 14px 7px 12px; border-radius: 6px; font-family: var(--f-disp); font-weight: 800; font-size: 20px; letter-spacing: .07em; text-transform: uppercase; box-shadow: 0 6px 20px rgba(0,0,0,.45); animation: cpopIn .18s ease-out; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.cpop svg { width: 18px; height: 18px; color: var(--gold); flex: none; }
.cpop small { font: 500 12px var(--f-body); letter-spacing: .01em; text-transform: none; color: #c4ccd9; margin-left: 4px; }
@keyframes cpopIn { from { transform: translateY(-8px) scale(.94); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

/* Awards Tab: Loadout Preview, Industrial Plates, Progress Bars & Clutch Log */
.aw-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.aw-summary { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.aw-stat { display: flex; flex-direction: column; align-items: flex-end; }
.aw-stat b { font-family: var(--f-disp); font-weight: 800; font-size: 32px; line-height: .95; }
.aw-stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.loadout-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.preview-box { background: var(--stage); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.preview-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #262c3a; color: #eceef2; }
.preview-head .eyebrow { color: #8f98ab; font-size: 12px; }
.preview-tag { font-family: var(--f-disp); font-weight: 800; font-size: 13px; letter-spacing: .08em; color: var(--gold); text-transform: uppercase; }
#loadoutCanvas { display: block; width: 100%; height: 144px; }
.preview-meta { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; border-top: 1px solid #262c3a; background: #141821; font-size: 12px; color: #9aa3b2; }
.preview-meta b { color: #eceef2; font-weight: 600; }
.loadout-slots { display: flex; flex-direction: column; gap: 10px; }
.lslot { display: flex; flex-direction: column; gap: 5px; }
.lslot-lbl { font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
.loadout-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lchip { border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; transition: border-color .15s, background .15s; }
.lchip svg { width: 13px; height: 13px; flex: none; opacity: .75; }
.lchip .swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); flex: none; }
.lchip.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.lchip.on .swatch { border-color: rgba(0,0,0,.45); }
.lchip:disabled { opacity: .45; cursor: not-allowed; }

.clutch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .clutch-grid { grid-template-columns: repeat(4, 1fr); } }
.cl-cell { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.cl-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.cl-top svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.cl-top b { font-family: var(--f-disp); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.cl-name { font-family: var(--f-disp); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
.cl-sub { font-size: 11px; color: var(--dim); line-height: 1.25; }

.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.ach { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.ach.t-elite { border-left-color: var(--ice); }
.ach.t-master { border-left-color: var(--master); }
.ach.t-legend { border-left-color: var(--accent); }
.ach.t-mythic { border-left-color: var(--gold); }
.ach:not(.on) { background: var(--panel2); }
.ach.on { box-shadow: var(--shadow); }
.ach-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.ach-id { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ach-ico { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); display: grid; place-items: center; flex: none; color: var(--dim); }
.ach.on.t-elite .ach-ico { color: var(--ice); border-color: var(--ice); background: color-mix(in srgb, var(--ice) 12%, var(--panel)); }
.ach.on.t-master .ach-ico { color: var(--master); border-color: var(--master); background: color-mix(in srgb, var(--master) 12%, var(--panel)); }
.ach.on.t-legend .ach-ico { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.ach.on.t-mythic .ach-ico { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--panel)); }
.ach-ico svg { width: 17px; height: 17px; }
.ach-name { font-family: var(--f-disp); font-weight: 800; font-size: 21px; text-transform: uppercase; line-height: 1.05; }
.ach-status { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
.ach.on .ach-status { color: var(--good); }
.ach-status svg { width: 11px; height: 11px; }
.tier { font-family: var(--f-disp); font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; flex: none; }
.tier.elite { background: color-mix(in srgb, var(--ice) 16%, var(--panel2)); color: var(--ice); border-color: var(--ice); }
.tier.master { background: color-mix(in srgb, var(--master) 16%, var(--panel2)); color: var(--master); border-color: var(--master); }
.tier.legend { background: color-mix(in srgb, var(--accent) 18%, var(--panel2)); color: var(--accent); border-color: var(--accent); }
.tier.mythic { background: color-mix(in srgb, var(--gold) 22%, var(--panel2)); color: var(--ink); border-color: var(--gold); }
.ach-prog { display: flex; flex-direction: column; gap: 4px; }
.ach-bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.ach-bar i { display: block; height: 100%; background: var(--dim); border-radius: 3px; }
.ach.on .ach-bar i { background: var(--good); }
.ach.t-elite:not(.on) .ach-bar i { background: var(--ice); }
.ach.t-master:not(.on) .ach-bar i { background: var(--master); }
.ach.t-legend:not(.on) .ach-bar i { background: var(--accent); }
.ach.t-mythic:not(.on) .ach-bar i { background: var(--gold); }
.ach-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding-top: 2px; border-top: 1px solid var(--line); }
.ach-rew { color: var(--ink); font-weight: 600; }
.ach.on .ach-rew { color: var(--good); }
.ach-pct { font-family: var(--f-disp); font-weight: 700; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--ink); background: transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(1px); } .btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.accent { border-color: var(--accent); color: var(--accent); } .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: var(--line); color: var(--dim); } .btn.big { font-size: 18px; padding: 12px 22px; min-height: 52px; font-family: var(--f-disp); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.row { display: flex; align-items: center; } .row.end { justify-content: flex-end; gap: 10px; margin-top: 8px; } .row.center { justify-content: center; } .row.gap { gap: 8px; } .row.wrap { flex-wrap: wrap; } .col { display: flex; flex-direction: column; } .col.gap { gap: 8px; }
.inp { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 16px; min-height: 44px; } .inp.sm { min-height: 38px; padding: 6px 10px; flex: 1; min-width: 0; } .inp.bad { border-color: var(--bad); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { display: flex; width: 100%; max-width: 640px; gap: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 6px 2px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--dim); font-family: var(--f-disp); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; min-height: 52px; }
.tabs button svg { width: 22px; height: 22px; } .tabs button.on { color: var(--accent-ink); background: var(--accent); }
.lineBar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 19; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.lineBar[hidden] { display: none !important; }
.lineBar .in { max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 6px 6px 6px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.lineBar .btn { color: var(--bg); border-color: var(--bg); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; cursor: pointer; font-weight: 600; min-height: 42px; border-left: 1px solid var(--line); } .seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--bg); }
.card.daily { border-color: var(--accent); }
.rows li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); } .rows li:first-child { border-top: 0; }
.rows li[data-act] { cursor: pointer; } .rows li.me { background: color-mix(in srgb, var(--accent) 12%, transparent); } .rows li.first { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.rows .rk { font-family: var(--f-disp); font-weight: 800; font-size: 24px; width: 30px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.rows .rw { flex: 1; display: flex; flex-direction: column; min-width: 0; } .rows .rw b { overflow-wrap: anywhere; }
.rows .rn { font-family: var(--f-disp); font-weight: 800; font-size: 32px; line-height: 1; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.rows .rn i { font-style: normal; font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }

    out.x = sw.x0 + 0.5 + o; out.y = sw.y0 + 0.5; return out;
  }
  bulletPos(cn) {
    const a = (this.hz + cn.ph) % cn.P, d = a * cn.speed;
    if (d > cn.free) return null;
    const out = this._bulOut;
    out.a = a;
    if (cn.dir === 'f') { out.x = cn.x - d; out.y = cn.y + 0.5; return out; }
    if (cn.dir === 'r') { out.x = cn.x + 1 + d; out.y = cn.y + 0.5; return out; }
    out.x = cn.x + 0.5; out.y = cn.y + 1 + d; return out;
  }
  probe() {
    const lv = this.lv, pw = PH.pw, ph = PH.ph;
    const bottom = this.y + ph;
    const rowBelow = Math.floor(bottom + 0.06);
    const xa = Math.floor(this.x + 0.05), xb = Math.floor(this.x + pw - 0.05);
    const wasGround = this.grounded;
    let ground = false, ice = false, bounce = false, stand = null, conv = 0, boost = false, mud = false;
    const gap = rowBelow - bottom;
    if (this.vy >= 0 && gap <= 0.14 && gap >= -0.15) {
      for (let tx = xa; tx <= xb; tx++) {
        if (this.solidT(tx, rowBelow) || (this.typeAt(tx, rowBelow) === T_ONEWAY && bottom <= rowBelow + 0.03)) {
          ground = true;
          const tp = this.typeAt(tx, rowBelow);
          if (tp === T_BOOST) boost = true;
          if (tp === T_MUD) mud = true;
          if (tp === T_ICE) ice = true;
          if (tp === T_BOUNCE) bounce = true;
          if (tp === T_CONVR) conv = PH.conv; else if (tp === T_CONVL) conv = -PH.conv;
          if (tp === T_CRUMBLE) { const k = rowBelow * lv.w + tx; if (!this.cr.has(k)) { this.cr.set(k, 0); this.ev('crumble'); } const ct = this.cr.get(k) || 0; this.lastCrumbleRem = Math.min(this.lastCrumbleRem, PH.crumbleDelay - ct); }
        }
      }
      // Swept bounce check during dash so high-speed dashes never skip over a bounce pad
      if (!bounce && this.dashing && this.prevX !== undefined) {
        const sxa = Math.floor(Math.min(this.prevX, this.x) + 0.05);
        const sxb = Math.floor(Math.max(this.prevX, this.x) + pw - 0.05);
        for (let tx = sxa; tx <= sxb; tx++) {
          if (this.typeAt(tx, rowBelow) === T_BOUNCE) { bounce = true; ground = true; break; }
        }
      }
    }
    if (!ground && this.vy >= -0.01) {
      for (let i = 0; i < lv.movers.length; i++) {
        const m = lv.movers[i], r = this.rect(m);
        if (this.x + pw > r.x + 0.02 && this.x < r.x + r.w - 0.02 && Math.abs(bottom - r.y) < 0.12) { ground = true; stand = m; break; }
      }
    }
    this.standing = stand;
    this.grounded = ground; this.onIce = ice; this.conv = ground && !stand ? conv : 0; this.onMud = ground && mud && !stand;
    if (ground) {
      if (!wasGround) {
        if (this.pendingSaviour) { this.clutches.push('saviour'); this.ev('clutch_saviour'); }
        if (this.pendingWallSave) { this.clutches.push('wallsave'); this.ev('clutch_wallsave'); }
        if (this.pendingSkim) { this.clutches.push('skim'); this.ev('clutch_skim'); }
        if (this.airOrbs >= 2 && this.airDashes >= 2) { this.clutches.push('orbchain'); this.ev('clutch_orbchain'); }
      }
      this.inVoidDanger = false; this.pendingSaviour = false; this.pendingWallSave = false; this.pendingSkim = false;
      this.airOrbs = 0; this.airDashes = 0; this.phasedSet.clear();
      if (this.typeAt(Math.floor(this.x + pw / 2), rowBelow) !== T_CRUMBLE) this.lastCrumbleRem = 9;
      this.coyote = PH.coyote; this.jumpsLeft = this.cfg.jumps - 1; if (!this.dashing) this.dashes = 1;
      if (!wasGround) this.ev('land');
      if (boost && !bounce && !this.dashing && this.boostCd <= 0) { this.vx = PH.boostV * this.cfg.speed; this.lock = Math.max(this.lock, PH.boostLock); this.face = 1; this.boostCd = PH.boostCd; this.ev('boost'); }
      if (bounce) {
        if (this.dashing) { this.dashing = false; this.dashT = 0; this.vx = this.dashDir * PH.run * this.cfg.speed * 1.12; }
        this.vy = -PH.bounce; this.grounded = false; this.coyote = 0; this.jumping = false; this.dashes = 1; this.ev('bounce');
      }
    }
    // walls
    this.wall = 0;
    if (!this.grounded) {
      const ya = Math.floor(this.y + 0.2), yb = Math.floor(this.y + ph - 0.2);
      const lx = Math.floor(this.x - 0.08), rx = Math.floor(this.x + pw + 0.08);
      for (let ty = ya; ty <= yb; ty++) {
        if (this.solidT(rx, ty)) { this.wall = 1; break; }
        if (this.solidT(lx, ty)) { this.wall = -1; break; }
      }
      if (this.wall) { this.wallSide = this.wall; this.wallT = 0.1; }
    }
    // spikes
    const bx0 = this.x + 0.12, bx1 = this.x + pw - 0.12, by0 = this.y + 0.25, by1 = this.y + ph;
    for (let ty = Math.floor(by0); ty <= Math.floor(by1 - 1e-6); ty++) {
      for (let tx = Math.floor(bx0); tx <= Math.floor(bx1); tx++) {
        const tpp = this.typeAt(tx, ty);
        if ((tpp === T_SPIKE || (tpp === T_PULSE && this.safeT <= 0 && pulseOnAt(this.hz))) && bx1 > tx + 0.12 && bx0 < tx + 0.88 && by1 > ty + 0.5 && by0 < ty + 1) { this.die(); return; }
      }
    }
    if (this.y > lv.h + 3) { this.die(); return; }
    // Spike skim detection
    if (!this.grounded && !this.pendingSkim) {
      const sy = Math.floor(by1 + 0.18);
      for (let tx = Math.floor(bx0); tx <= Math.floor(bx1); tx++) {
        const tp = this.typeAt(tx, sy);
        if ((tp === T_SPIKE || (tp === T_PULSE && pulseOnAt(this.hz))) && by1 > sy + 0.30 && by1 <= sy + 0.51) {
          this.pendingSkim = true; break;
        }
      }
    }
    for (let si = 0; si < lv.saws.length; si++) {
      const sw = lv.saws[si], q = this.sawPos(sw), nx = clamp(q.x, bx0, bx1), ny = clamp(q.y, by0, by1);
      const d2 = (q.x - nx) * (q.x - nx) + (q.y - ny) * (q.y - ny);
      if (!this.dashing && this.safeT <= 0 && d2 < PH.sawR * PH.sawR) { this.die(); return; }
      if (this.dashing && d2 < (PH.sawR + 0.16) * (PH.sawR + 0.16) && !this.phasedSet.has('s' + si)) {
        this.phasedSet.add('s' + si); this.clutches.push('phantom'); this.ev('clutch_phantom');
      }
    }
    for (let ci = 0; ci < lv.cans.length; ci++) {
      const cn = lv.cans[ci], q = this.bulletPos(cn); if (!q) continue;
      const nx = clamp(q.x, bx0, bx1), ny = clamp(q.y, by0, by1);
      const d2 = (q.x - nx) * (q.x - nx) + (q.y - ny) * (q.y - ny);
      if (!this.dashing && this.safeT <= 0 && d2 < PH.bulletR * PH.bulletR) { this.die(); return; }
      if (this.dashing && d2 < (PH.bulletR + 0.2) * (PH.bulletR + 0.2) && !this.phasedSet.has('b' + ci)) {
        this.phasedSet.add('b' + ci); this.clutches.push('phantom'); this.ev('clutch_phantom');
      }
    }
    for (let ty = Math.floor(this.y); ty <= Math.floor(this.y + ph - 1e-6); ty++) for (let tx = Math.floor(this.x); tx <= Math.floor(this.x + pw - 1e-6); tx++) {
      if (this.typeAt(tx, ty) === T_ORB && !this.orbU.has(ty * lv.w + tx)) {
        this.orbU.set(ty * lv.w + tx, PH.orbCd); this.jumpsLeft = Math.max(this.jumpsLeft, 1); this.dashes = 1; this.airOrbs++; if (this.inVoidDanger) this.pendingSaviour = true; this.ev('orb');
      }
    }
    if (lv.starTotal) {
      for (let ty = Math.floor(this.y - 0.1); ty <= Math.floor(this.y + ph + 0.1); ty++) for (let tx = Math.floor(this.x - 0.1); tx <= Math.floor(this.x + pw + 0.1); tx++) {
        if (this.typeAt(tx, ty) === T_STAR) { const sk = ty * lv.w + tx; if (!this.starSet.has(sk)) { this.starSet.add(sk); this.stars++; this.ev('star'); } }
      }
    }
    if (lv.portals.length === 2 && this.portalCd <= 0) {
      const pcx = Math.floor(this.x + pw / 2), pcy = Math.floor(this.y + ph / 2);
      for (let pi = 0; pi < 2; pi++) {
        const pt = lv.portals[pi];
        if (pt.x === pcx && pt.y === pcy) {
          const o = lv.portals[1 - pi];
          this.x = o.x + 0.15; this.y = o.y + 1 - ph - 0.001; this.prevX = this.x; this.portalCd = 0.8; this.standing = null; this.ev('portal');
          break;
        }
      }
    }
    for (let i = 0; i < lv.checks.length; i++) {
      const k = lv.checks[i];
      if (this.x + pw > k.x - 0.1 && this.x < k.x + 1.1 && this.y + ph > k.y - 10 && this.y < k.y + 1.5) {
        const nx = k.x + 0.15, ny = k.y + 1 - ph - 0.001;
        if (this.spawn.x !== nx || this.spawn.y !== ny) { this.spawn.x = nx; this.spawn.y = ny; this.ev('check'); }
      }
    }
    const gl = lv.goal;
    if (gl && this.x + pw > gl.x - 0.2 && this.x < gl.x + 1.2 && this.y + ph > gl.y - 12 && this.y < gl.y + 2) {
      if (!this.won) {
        if (this.cfg.chase > 0 && (this.x - this.chaseX) <= 2.2) { this.clutches.push('chase'); this.ev('clutch_chase'); }
        this.won = true; this.ev('clear');
      }
    }
  }
}

/* ---------- Verified Infinite Level Generator (1..1000+ Beatable) ---------- */
const SOLID_STAND = new Set(['#', 'i', 'b', 'c', 'e', 'q', 'm', 'n', 'f', 'r', 'd', 'p', 'y', 'z']);
const SAFE_STAND = new Set(['#', 'i', 'e', 'q']);
const HAZARD_CH = new Set(['^', 'x', 'w', 'v', 'f', 'r', 'd']);

function validateGeneratedLevel(L) {
  if (!L || !Array.isArray(L.rows) || !L.rows.length) return { ok: false, reason: 'empty' };
  const w = L.w, h = L.h, rows = L.rows, cfg = L.cfg || defaultCfg();
  if (w > 260) return { ok: false, reason: 'width_exceeded' };
  const at = (x, y) => (x >= 0 && x < w && y >= 0 && y < h) ? rows[y][x] : '#';
  const isSolid = ch => ch === '#' || ch === 'i' || ch === 'b' || ch === 'c' || ch === 'e' || ch === 'q' || ch === 'f' || ch === 'r' || ch === 'd' || ch === 'y' || ch === 'z';
  const isPassable = ch => !isSolid(ch);

  let start = null, goal = null;
  const checks = [];
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) return { ok: false, reason: 'row_width' };
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === 'S') { if (start) return { ok: false, reason: 'multi_start' }; start = { x, y }; }
      if (ch === 'G') { if (goal) return { ok: false, reason: 'multi_goal' }; goal = { x, y }; }
      if (ch === 'K') checks.push({ x, y });
    }
  }
  if (!start || !goal) return { ok: false, reason: 'missing_endpoints' };

  const checkAnchor = (pt, rad, label) => {
    if (!SAFE_STAND.has(at(pt.x, pt.y + 1))) return `${label}_no_ground`;
    if (!isPassable(at(pt.x, pt.y - 1)) || !isPassable(at(pt.x, pt.y - 2))) return `${label}_low_ceiling`;
    for (let dx = -rad; dx <= rad; dx++) {
      for (let dy = -1; dy <= 0; dy++) {
        if (HAZARD_CH.has(at(pt.x + dx, pt.y + dy))) return `${label}_hazard`;
      }
    }
    return null;
  };
  const sErr = checkAnchor(start, 2, 'start'); if (sErr) return { ok: false, reason: sErr };
  const gErr = checkAnchor(goal, 1, 'goal'); if (gErr) return { ok: false, reason: gErr };
  for (const k of checks) { const kErr = checkAnchor(k, 1, 'check'); if (kErr) return { ok: false, reason: kErr }; }

  const bonusJ = (cfg.jumps > 1 ? 2 : 0) + ((cfg.grav || 1) < 0.9 ? 2 : 0);
  const gapJump = dy => dy <= -3 ? 3 : dy === -2 ? 4 : dy <= 1 ? 5 : dy <= 3 ? 6 : 7;
  const gapDash = dy => dy <= -3 ? 8 : dy === -2 ? 9 : dy <= 0 ? 10 : dy <= 3 ? 11 : 12;
  const maxJumpH = Math.floor((PH.jump * PH.jump) / (2 * PH.g * (cfg.grav || 1))) + (cfg.jumps > 1 ? 2 : 0);
  const maxReach = (cfg.dash !== false ? 12 : 7) + bonusJ + 6;
  const maxBounceH = Math.floor((PH.bounce * PH.bounce) / (2 * PH.g * (cfg.grav || 1)));
  const maxJumpX = 5 + bonusJ;

  const key = (x, y) => y * w + x;
  const standable = (x, y) => {
    if (x < 0 || x >= w || y < 1 || y >= h - 1) return false;
    const ch = at(x, y);
    if (!isPassable(ch) || ch === '^') return false;
    return SOLID_STAND.has(at(x, y + 1));
  };

  const lv = parseLevel(L);
  const moverMap = new Map();
  for (const m of lv.movers) {
    for (let x = m.x0; x < m.x0 + m.w; x++) moverMap.set(key(x, m.y0), m);
  }

  const visited = new Uint8Array(w * h);
  const queue = [{ x: start.x, y: start.y }];
  visited[key(start.x, start.y)] = 1;

  const enqueue = (nx, ny) => {
    if (nx < 0 || nx >= w || ny < 1 || ny >= h - 1) return;
    const k = key(nx, ny);
    if (visited[k]) return;
    if (standable(nx, ny) || at(nx, ny) === 'o' || at(nx, ny) === 'u') {
      visited[k] = 1;
      queue.push({ x: nx, y: ny });
    }
  };

  let head = 0;
  while (head < queue.length) {
    const cur = queue[head++];
    if (Math.abs(cur.x - goal.x) <= 1 && Math.abs(cur.y - goal.y) <= 1) return { ok: true };

    const below = at(cur.x, cur.y + 1);
    const here = at(cur.x, cur.y);

    for (const dx of [-1, 1]) {
      const nx = cur.x + dx;
      if (nx < 0 || nx >= w) continue;
      if (isPassable(at(nx, cur.y))) {
        for (let dy = 0; dy <= 10; dy++) {
          const ny = cur.y + dy;
          if (ny >= h - 1) break;
          if (!isPassable(at(nx, ny))) break;
          if (standable(nx, ny) || at(nx, ny) === 'o' || at(nx, ny) === 'u') { enqueue(nx, ny); if (SOLID_STAND.has(at(nx, ny + 1))) break; }
        }
      }
      for (let up = 1; up <= Math.min(3, maxJumpH); up++) {
        const ny = cur.y - up;
        if (ny < 1) break;
        if (!isPassable(at(cur.x, ny))) break;
        if (standable(nx, ny)) enqueue(nx, ny);
      }
    }

    for (let dx = 1; dx <= maxReach; dx++) {
      const nx = cur.x + dx;
      if (nx >= w) break;
      const gap = dx - 1;
      let orbBonus = 0;
      if (gap >= 4) {
        for (let mx = cur.x + 1; mx < nx && !orbBonus; mx++) for (let oy = cur.y - 6; oy <= cur.y + 1; oy++) if (at(mx, oy) === 'o') { orbBonus = 6; break; }
      }
      for (let dy = -3; dy <= 8; dy++) {
        const ny = cur.y + dy;
        if (ny < 1 || ny >= h - 1) continue;
        const reach = (cfg.dash !== false ? gapDash(dy) : gapJump(dy)) + bonusJ + orbBonus;
        if (gap > reach) continue;
        if (!(standable(nx, ny) || at(nx, ny) === 'o' || at(nx, ny) === 'u')) continue;
        let blocked = false;
        if (dx >= 2) {
          const checkY = Math.min(cur.y, ny);
          for (let mx = cur.x + 1; mx < nx; mx++) {
            if (!isPassable(at(mx, checkY)) && !isPassable(at(mx, checkY - 1))) { blocked = true; break; }
          }
        }
        if (!blocked) enqueue(nx, ny);
      }
    }

    if (below === 'b') {
      for (let dx = -2; dx <= 8; dx++) {
        for (let dy = -maxBounceH; dy <= 2; dy++) enqueue(cur.x + dx, cur.y + dy);
      }
    }

    if (here === 'u') {
      let ty = cur.y;
      while (ty > 1 && at(cur.x, ty - 1) === 'u') { ty--; enqueue(cur.x, ty); }
      for (let dx = -2; dx <= 4; dx++) {
        for (let dy = -3; dy <= 1; dy++) enqueue(cur.x + dx, ty + dy);
      }
    }

    const mv = moverMap.get(key(cur.x, cur.y + 1));
    if (mv) {
      if (mv.axis === 'h') {
        const endX = mv.x0 + mv.w - 1 + mv.range;
        for (let dx = 1; dx <= maxJumpX + 1; dx++) {
          for (let dy = -2; dy <= 4; dy++) enqueue(endX + dx, mv.y0 - 1 + dy);
        }
      } else if (mv.axis === 'v') {
        const topY = mv.y0 - mv.range - 1;
        for (let dx = -2; dx <= mv.w + maxJumpX; dx++) {
          for (let dy = -2; dy <= 2; dy++) enqueue(mv.x0 + dx, topY + dy);
        }
      }
    }

    if (cfg.wall !== false) {
      const hasLeftWall = isSolid(at(cur.x - 1, cur.y)) && isSolid(at(cur.x - 1, cur.y - 1));
      const hasRightWall = isSolid(at(cur.x + 1, cur.y)) && isSolid(at(cur.x + 1, cur.y - 1));
      if (hasLeftWall || hasRightWall) {
        let ty = cur.y;
        while (ty > 2 && isPassable(at(cur.x, ty - 1))) {
          ty--;
          let opp = false;
          for (let wx = -4; wx <= 4; wx++) if (wx !== 0 && isSolid(at(cur.x + wx, ty))) { opp = true; break; }
          if (!opp) break;
          for (let dx = -2; dx <= 5; dx++) enqueue(cur.x + dx, ty);
        }
      }
    }
  }

  return { ok: false, reason: 'unreachable_goal' };
}

function buildFallbackLevel(n, seed) {
  const H = 24, W = 54;
  const cols = Array.from({ length: W }, () => new Array(H).fill('.'));
  const ground = (x0, w, gy, top = '#') => {
    for (let x = x0; x < x0 + w; x++) for (let y = gy; y < H; y++) cols[x][y] = (y === gy ? top : '#');
  };
  ground(0, 10, 16); cols[3][15] = 'S';
  ground(13, 8, 15); cols[16][14] = '^';
  ground(24, 9, 14); cols[26][13] = 'K';
  ground(36, 6, 14, 'i');
  ground(45, 9, 15); cols[50][14] = 'G';
  const rows = [];
  for (let y = 0; y < H; y++) { let s = ''; for (let x = 0; x < W; x++) s += cols[x][y]; rows.push(s); }
  return {
    name: 'Level ' + n, w: W, h: H, rows, segMeta: [], intro: [], mod: null, mods: [],
    cfg: Object.assign(defaultCfg(), { theme: THEME_KEYS[Math.floor((n - 1) / 2) % THEME_KEYS.length] })
  };
}

function genLevelRaw(n, seed, chaos) {
  const rng = mulberry32(((Math.imul(seed | 0, 0x9E3779B1) ^ Math.imul(n, 0x85EBCA6B)) >>> 0) || 1);
  const R = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const tn = chaos ? Math.round(Math.max(0, n - 1) * 1.5) : Math.max(0, n - 1);
  const t = tn * 1.4;
  const tier = Math.log2(1 + tn / 5); // continuous escalation across 1 -> 50 -> 100 -> 200 -> 1000+
  const H = 24;
  const cols = [];
  const col = x => { while (cols.length <= x) cols.push(new Array(H).fill('.')); return cols[x]; };
  const put = (x, y, ch) => { if (y >= 0 && y < H) col(x)[y] = ch; };
  const ground = (x0, w, gy, top) => {
    for (let x = x0; x < x0 + w; x++) for (let y = gy; y < H; y++) put(x, y, y === gy ? (top || '#') : '#');
  };

  // Escalating mutators: early levels introduce single mutators; Lv 50+ drops easy float/double for brutal combos
  const mods = [];
  if (n < 60) {
    if (n >= 9 && n % 9 === 0) mods.push('double');
    else if (n >= 8 && n % 8 === 0) mods.push('float');
    else if (n >= 10 && n % 4 === 2) mods.push('chase');
    else if (n >= 11 && n % 7 === 3) mods.push('turbo');
    else if (n >= 12 && n % 6 === 0) mods.push('dark');
    else if (n >= 13 && n % 6 === 1) mods.push('slick');
    else if (n >= 14 && n % 7 === 0) mods.push('iron');
    else if (n >= 15 && n % 8 === 5) mods.push('nodash');
  } else {
    // High-tier (Lv 60+): every level is intense; no free easy low-gravity float or double-jump crutches
    const modSlot = n % 7;
    if (modSlot === 0) mods.push('turbo', 'iron');
    else if (modSlot === 1) mods.push('slick', 'turbo');
    else if (modSlot === 2) mods.push('chase', 'dark');
    else if (modSlot === 3) mods.push('dark', 'iron');
    else if (modSlot === 4) mods.push('chase', 'turbo');
    else if (modSlot === 5) mods.push('slick', 'iron');
    else if (n % 2) mods.push('nodash');
    else mods.push('turbo');
  }
  if (n >= 25 && n < 60 && n % 5 !== 0) {
    if (mods.includes('turbo') && n >= 30 && rng() < 0.5) mods.push('slick');
    else if (mods.includes('chase') && n >= 35 && rng() < 0.45) mods.push('dark');
    else if (mods.includes('float') && n >= 40 && rng() < 0.45) mods.push('iron');
    else if (!mods.length && n >= 45 && rng() < 0.5) { mods.push('turbo', 'iron'); }
  }
  if (chaos) {
    // Chaos: every level past the first couple carries random mutators
    mods.length = 0;
    const bag = ['double', 'float', 'chase', 'turbo', 'dark', 'slick', 'iron', 'nodash'];
    const cnt = n < 3 ? 0 : n < 12 ? 1 : 2;
    for (let i = 0; i < cnt; i++) mods.push(bag.splice(Math.floor(rng() * bag.length), 1)[0]);
  }
  const hasMod = m => mods.includes(m);
  const mod = mods[0] || null;

  const gapMax = Math.min(hasMod('nodash') ? 4 : 5, 2 + Math.floor(t / 3)) + (hasMod('double') ? 2 : 0);
  const platMin = Math.max(2, 4 - Math.floor(t / 3.5));
  const spikeRun = Math.min(4, 1 + Math.floor(t / 3.5));
  const ms = Math.min(7.5, 2.4 + t * 0.08 + tier * 0.45);
  const bs = Math.min(12.2, 6.0 + t * 0.06 + tier * 0.52);
  const bp = Math.max(1.05, 2.6 - t * 0.024 - tier * 0.16);
  const sawMult = Math.min(1.65, 1 + Math.min(0.65, tier * 0.11));

  let x = 10, gy = 16;
  ground(0, 10, 16); put(3, 15, 'S');
  let shafts = 0, lifts = 0;
  const maxShafts = t >= 25 ? 2 : 1;

  const S = {
    flat() { const w = R(3, 4); ground(x, w, gy); x += w; },
    gap() {
      const gw = R(2, gapMax);
      let dy = pick([0, 0, -1, 1, 2]);
      if (dy === -1 && gw > 3) dy = 0;
      const g2 = clamp(gy + dy, 7, 17), lw = R(platMin, platMin + 2);
      ground(x + gw, lw, g2); x += gw + lw; gy = g2;
    },
    steps() {
      const up = gy <= 9 ? false : (gy >= 15 ? true : rng() < 0.5);
      const k = R(2, 4);
      for (let i = 0; i < k; i++) {
        const h = up ? -R(1, t >= 3 ? 2 : 1) : R(1, 2);
        const ng = clamp(gy + h, 7, 17), w = R(2, t < 5 ? 4 : 3);
        ground(x, w, ng); gy = ng; x += w;
      }
    },
    float() {
      let fy = gy, cx = x;
      const k = R(3, Math.min(5, 3 + Math.floor(tier / 2)));
      for (let i = 0; i < k; i++) {
        const gi = R(1, Math.min(4, gapMax));
        let dd = pick([0, 0, -1, 1, -2]);
        if (dd === -2 && gi > 2) dd = -1;
        if (dd === -1 && gi > 3) dd = 0;
        const f2 = clamp(fy + dd, 7, 17), pw = Math.max(2, R(platMin, platMin + 1));
        for (let xx = cx + gi; xx < cx + gi + pw; xx++) put(xx, f2, '#');
        cx += gi + pw; fy = f2;
      }
      const gi = R(1, Math.min(gapMax, 3)), len = R(3, 4);
      ground(cx + gi, len, fy); x = cx + gi + len; gy = fy;
    },
    spikes() {
      const w1 = R(2, 3), sr = R(Math.min(2, spikeRun), spikeRun), w2 = R(2, 3);
      ground(x, w1 + sr + w2, gy);
      for (let i = 0; i < sr; i++) put(x + w1 + i, gy - 1, '^');
      x += w1 + sr + w2;
      if (t >= 12 && rng() < 0.6) {
        const a = R(2, 3), sr2 = R(1, Math.min(3, spikeRun)), b = R(2, 3);
        ground(x, a + sr2 + b, gy);
        for (let i = 0; i < sr2; i++) put(x + a + i, gy - 1, '^');
        x += a + sr2 + b;
      }
    },
    ice() {
      if (t >= 9 && rng() < 0.55) {
        ground(x, 4, gy, 'i'); ground(x + 6, 4, gy, 'i'); x += 10;
      } else { const w = R(6, 9); ground(x, w, gy, 'i'); x += w; }
      ground(x, 3, gy); x += 3;
    },
    crumble() {
      const k = R(3, Math.min(5, 3 + Math.floor(tier / 2))); let cx = x;
      for (let i = 0; i < k; i++) {
        const gi = R(1, 2);
        for (let j = 0; j < 2; j++) put(cx + gi + j, gy, 'c');
        cx += gi + 2;
      }
      const gi = R(1, 2), len = R(3, 4);
      ground(cx + gi, len, gy); x = cx + gi + len;
    },
    bounce() {
      if (gy - 3 < 7) return S.flat();
      ground(x, 5, gy); put(x + 2, gy, 'b'); put(x + 3, gy, 'b');
      const ng = gy - 3, len = R(4, 5);
      ground(x + 7, len, ng); x += 7 + len; gy = ng;
    },
    hmover() {
      const gw = R(6, 7), len = R(4, 5);
      ground(x, 2, gy);
      for (let i = 0; i < 3; i++) put(x + 2 + i, gy, 'm');
      ground(x + 2 + gw, len, gy); x += 2 + gw + len;
    },
    lift() {
      if (gy < 12 || hasMod('chase')) return S.flat();
      ground(x, 2, gy);
      for (let i = 0; i < 3; i++) put(x + 2 + i, gy, 'n');
      const len = R(4, 5);
      ground(x + 5, len, gy - 5); gy -= 5; x += 5 + len;
    },
    pulse() {
      const run = R(3, Math.min(5, 3 + Math.floor((t - 4) / 4)));
      ground(x, 2 + run + 2, gy);
      for (let i = 0; i < run; i++) put(x + 2 + i, gy - 1, 'x');
      x += 4 + run;
    },
    conveyor() {
      const w = R(6, 8), ch = rng() < 0.65 ? 'q' : 'e';
      ground(x, w, gy);
      for (let i = 0; i < w; i++) put(x + i, gy, ch);
      x += w; ground(x, 3, gy); x += 3;
    },
    saws() {
      const sr = Math.min(5, 3 + Math.floor((t - 9) / 6)), w = 2 + sr + 4;
      ground(x, w, gy); put(x + 2, gy - 1, 'w'); x += w;
    },
    orbs() {
      const chain = t >= 18 && rng() < 0.55;
      const gw = chain ? 12 : R(7, 9), len = R(4, 5);
      ground(x, 3, gy);
      put(x + 3 + Math.floor(gw / 2) - (chain ? 2 : 0), gy - 3, 'o');
      if (chain) put(x + 3 + 8, gy - 3, 'o');
      ground(x + 3 + gw, len, gy); x += 3 + gw + len;
    },
    vent() {
      const vh = R(5, Math.min(7, gy - 7));
      if (vh < 5 || gy - vh < 7) return S.flat();
      const ng = gy - vh;
      ground(x, 3, gy); ground(x + 3, 2, gy);
      for (let yy = ng - 2; yy <= gy - 1; yy++) { put(x + 3, yy, 'u'); put(x + 4, yy, 'u'); }
      const len = R(4, 5); ground(x + 5, len, ng);
      gy = ng; x += 5 + len;
    },
    gauntlet() {
      const k = R(3, Math.min(4, 3 + Math.floor(tier / 3)));
      for (let i = 0; i < k; i++) {
        const w = R(5, 6); ground(x, w, gy);
        const kind = pick(['^', 'x', '^', 'x', '^^']);
        if (kind === '^^') { put(x + 2, gy - 1, '^'); put(x + 3, gy - 1, '^'); } else put(x + 2, gy - 1, kind);
        x += w;
        if (i < k - 1) { const gw = R(2, Math.min(4, gapMax)); x += gw; }
      }
    },
    shaft() {
      const hh = R(6, Math.min(9, gy - 7));
      if (gy - hh < 7 || hh < 6 || hasMod('chase')) return S.flat();
      const x0 = x;
      ground(x0, 4, gy);
      for (let y = gy - hh - 2; y <= gy - 3; y++) put(x0, y, '#');
      const len = R(4, 6);
      ground(x0 + 3, len + 1, gy - hh);
      gy -= hh; x = x0 + 4 + len;
    },
    drop() {
      const ng = clamp(gy + R(3, 5), 7, 17);
      if (ng <= gy) return S.flat();
      const len = R(4, 6);
      ground(x, 2, gy); ground(x + 2, len, ng);
      x += 2 + len; gy = ng;
    },
    dashgap() {
      const chain = t >= 16 && rng() < 0.5;
      const gw = chain ? R(6, 7) : R(7, 8), lw = R(4, 5);
      ground(x, 3, gy);
      let cx = x + 3;
      if (chain) { ground(cx + gw, 3, gy); cx += gw + 3; }
      ground(cx + gw, lw, gy);
      x = cx + gw + lw;
    },
    turret() {
      const h = (t >= 8 && rng() < 0.5) ? 2 : 1, w = R(7, 9), len = R(4, 5);
      if (gy - h < 7) return S.flat();
      ground(x, w + 1, gy);
      if (h === 1) { put(x + w, gy - 1, 'f'); }
      else { put(x + w, gy - 1, '#'); put(x + w, gy - 2, 'f'); }
      ground(x + w + 1, len, gy - h);
      x += w + 1 + len; gy -= h;
    },
    dropper() {
      if (gy < 9) return S.flat();
      const k = R(2, 3), sp = 4, w = 3 + k * sp + 2;
      ground(x, w, gy);
      for (let i = 0; i < k; i++) put(x + 3 + i * sp, gy - 5, 'd');
      x += w;
    },
    vsaw() {
      if (gy < 9) return S.flat();
      const k = R(2, 3), sp = 3 + (rng() < 0.5 ? 1 : 0), w = 3 + k * sp + 2;
      ground(x, w, gy);
      for (let i = 0; i < k; i++) put(x + 3 + i * sp, gy - 1, 'v');
      x += w;
    },
    combo_dash_saw() {
      if (gy < 9) return S.dashgap();
      const gw = R(6, 7), lw = R(4, 5);
      ground(x, 3, gy);
      put(x + 3 + Math.floor(gw / 2), gy - 1, 'v');
      ground(x + 3 + gw, lw, gy);
      x += 3 + gw + lw;
    },
    pulse_bridge() {
      const k = R(2, 3);
      let cx = x;
      ground(cx, 2, gy); cx += 2;
      for (let i = 0; i < k; i++) {
        put(cx + 1, gy, 'c'); put(cx + 2, gy, 'c');
        cx += 4;
        ground(cx, 4, gy);
        put(cx + 1, gy - 1, 'x'); put(cx + 2, gy - 1, 'x');
        cx += 4;
      }
      ground(cx, 3, gy);
      x = cx + 3;
    },
    ice_bounce() {
      if (gy - 3 < 7) return S.ice();
      ground(x, 6, gy, 'i');
      put(x + 3, gy, 'b'); put(x + 4, gy, 'b');
      const ng = gy - 3, lw = R(5, 6);
      ground(x + 8, lw, ng);
      x += 8 + lw; gy = ng;
    },
    cannon_gauntlet() {
      if (gy < 9) return S.turret();
      const w = 10, lw = R(4, 5);
      ground(x, w + 1, gy);
      put(x + 3, gy - 5, 'd');
      put(x + 7, gy - 5, 'd');
      put(x + w, gy - 1, 'f');
      ground(x + w + 1, lw, gy - 1);
      x += w + 1 + lw; gy -= 1;
    },
    mover_saw() {
      if (gy < 9) return S.hmover();
      const gw = 7, lw = R(4, 5);
      ground(x, 2, gy);
      for (let i = 0; i < 3; i++) put(x + 2 + i, gy, 'm');
      put(x + 7, gy - 2, 'v');
      ground(x + 2 + gw, lw, gy);
      x += 2 + gw + lw;
    },
    // --- Terrain remix: one-way ledges, boost pads, mud, ice and belt combos ---
    tower() {
      if (gy < 13) return S.flat();
      const x0 = x, len = R(4, 5);
      ground(x0, 9, gy);
      for (let j = 0; j < 3; j++) { put(x0 + 3 + j, gy - 2, 'p'); put(x0 + 6 + j, gy - 4, 'p'); }
      if (t >= 12) put(x0 + 4, gy - 1, '^');
      ground(x0 + 9, len, gy - 6);
      gy -= 6; x = x0 + 9 + len;
    },
    boostrun() {
      const w = R(11, 13), len = R(4, 5), gw = R(2, Math.min(4, gapMax));
      ground(x, w, gy);
      put(x + 2, gy, 'y'); put(x + 3, gy, 'y');
      ground(x + w + gw, len, gy); x += w + gw + len;
    },
    mudpulse() {
      const run = R(2, 3), w = 4 + run + 2;
      ground(x, w, gy);
      for (let i = 1; i < w - 2; i++) put(x + i, gy, 'z');
      for (let i = 0; i < run; i++) put(x + 3 + i, gy - 1, 'x');
      x += w;
    },
    ice_saws() {
      if (gy < 9) return S.ice();
      const w = 11;
      ground(x, w, gy, 'i');
      put(x + 4, gy - 1, 'v'); put(x + 8, gy - 1, 'v');
      ground(x + w, 3, gy); x += w + 3;
    },
    belt_gap() {
      const w = 9, gw = R(2, 3), len = R(4, 5);
      ground(x, w, gy);
      for (let i = 0; i < w; i++) put(x + i, gy, 'q');
      ground(x + w + gw, len, gy); x += w + gw + len;
    },
    bounce_saws() {
      if (gy - 3 < 7) return S.bounce();
      ground(x, 5, gy); put(x + 2, gy, 'b'); put(x + 3, gy, 'b');
      const ng = gy - 3, lw = 6;
      ground(x + 7, lw, ng); put(x + 10, ng - 1, 'v');
      x += 7 + lw; gy = ng;
    },
    // --- Master / Apex / Nightmare tier unlockable obstacles (Lv 45 -> 140+) ---
    orb_saw_gauntlet() {
      if (gy < 9) return S.orbs();
      const gw = 10, lw = R(4, 5);
      ground(x, 3, gy);
      put(x + 6, gy - 3, 'o');
      put(x + 9, gy - 1, 'v');
      ground(x + 3 + gw, lw, gy);
      x += 3 + gw + lw;
    },
    crumble_turret() {
      if (gy < 9) return S.crumble();
      ground(x, 2, gy);
      let cx = x + 2;
      for (let i = 0; i < 2; i++) { put(cx + 1, gy, 'c'); put(cx + 2, gy, 'c'); cx += 4; }
      ground(cx + 1, 5, gy);
      put(cx + 4, gy - 1, 'f');
      ground(cx + 6, 4, gy - 1);
      x = cx + 10; gy -= 1;
    },
    conveyor_spikes() {
      const w = 12;
      ground(x, w, gy);
      for (let i = 0; i < w; i++) put(x + i, gy, 'q');
      put(x + 3, gy - 1, '^');
      put(x + 7, gy - 1, 'x'); put(x + 8, gy - 1, 'x');
      ground(x + w, 3, gy);
      x += w + 3;
    },
    double_turret_shaft() {
      const hh = 6;
      if (gy - hh < 7 || hasMod('chase')) return S.cannon_gauntlet();
      const x0 = x;
      ground(x0, 4, gy);
      for (let y = gy - hh - 2; y <= gy - 3; y++) put(x0, y, '#');
      ground(x0 + 3, 9, gy - hh);
      put(x0 + 9, gy - hh - 1, 'f');
      ground(x0 + 12, 4, gy - hh - 1);
      gy = gy - hh - 1; x = x0 + 16;
    },
    apex_gauntlet() {
      if (gy < 9) return S.pulse_bridge();
      let cx = x;
      ground(cx, 3, gy); cx += 3;
      put(cx + 1, gy, 'c'); put(cx + 2, gy, 'c'); cx += 4;
      ground(cx, 5, gy); put(cx + 2, gy - 1, 'x'); put(cx + 3, gy - 1, 'v'); cx += 5;
      // Dash gap with saw into safe landing
      put(cx + 3, gy - 1, 'v');
      ground(cx + 6, 4, gy);
      x = cx + 10;
    },
    nightmare_orb_run() {
      if (gy < 9) return S.orb_saw_gauntlet();
      ground(x, 3, gy);
      put(x + 6, gy - 3, 'o');
      put(x + 9, gy - 1, 'v');
      put(x + 12, gy - 3, 'o');
      ground(x + 16, 5, gy);
      put(x + 18, gy - 1, '^');
      x += 21;
    }
  };

  const pool = [];
  const add = (name, w, minTn) => { if (tn >= minTn) pool.push([name, w]); };
  if (tn < 30) add('flat', t < 8 ? 2 : 0.45, 0);
  add('gap', tn < 50 ? 4.5 : 2.5, 0); add('steps', tn < 50 ? 2.8 : 1.5, 0); add('drop', 1.4, 1); add('float', 2.8, 2);
  add('spikes', 3.0, 2); add('pulse', 2.5, 1); add('ice', 2.0, 2); add('dashgap', 2.8, 3);
  add('crumble', 2.2, 5); add('conveyor', 2.2, 5); add('bounce', 1.8, 6); add('hmover', 2.5, 6);
  add('saws', 2.6, 7); add('shaft', 2.0, 8); add('turret', 2.8, 10); add('orbs', 2.2, 10);
  add('vsaw', 2.6, 11); add('lift', 1.2, 12); add('dropper', 2.6, 13); add('vent', 1.6, 13); add('gauntlet', 2.6, 15);
  // Expert tier (Lv 18+)
  add('combo_dash_saw', 2.6 + Math.min(2.4, tier * 0.45), 17);
  add('pulse_bridge', 2.4 + Math.min(2.2, tier * 0.4), 20);
  add('ice_bounce', 2.0 + Math.min(1.6, tier * 0.35), 24);
  add('cannon_gauntlet', 2.6 + Math.min(2.4, tier * 0.45), 28);
  add('mover_saw', 2.4 + Math.min(2.0, tier * 0.4), 35);
  // Terrain remix
  add('tower', 2.4, 4); add('boostrun', 2.2, 9); add('mudpulse', 2.2, 12);
  add('ice_saws', 2.2 + Math.min(1.8, tier * 0.3), 18); add('belt_gap', 2.2, 22); add('bounce_saws', 2.2 + Math.min(1.8, tier * 0.3), 30);
  // Master / Apex / Nightmare tier (Lv 45 -> 140+)
  add('orb_saw_gauntlet', 2.8 + Math.min(2.5, tier * 0.45), 44);
  add('crumble_turret', 2.8 + Math.min(2.5, tier * 0.45), 54);
  add('conveyor_spikes', 2.6 + Math.min(2.4, tier * 0.4), 64);
  add('double_turret_shaft', 2.2 + Math.min(1.8, tier * 0.35), 79);
  add('apex_gauntlet', 3.2 + Math.min(3.0, tier * 0.5), 99);
  add('nightmare_orb_run', 3.2 + Math.min(3.0, tier * 0.5), 139);

  if (hasMod('nodash')) { for (let i = pool.length - 1; i >= 0; i--) if (['dashgap', 'combo_dash_saw', 'apex_gauntlet'].includes(pool[i][0])) pool.splice(i, 1); }
  const hard = new Set(['shaft', 'hmover', 'lift', 'crumble', 'bounce', 'saws', 'orbs', 'vent', 'gauntlet', 'dashgap', 'turret', 'dropper', 'vsaw', 'combo_dash_saw', 'pulse_bridge', 'ice_bounce', 'cannon_gauntlet', 'mover_saw', 'orb_saw_gauntlet', 'crumble_turret', 'conveyor_spikes', 'double_turret_shaft', 'apex_gauntlet', 'nightmare_orb_run', 'mudpulse', 'ice_saws', 'belt_gap', 'bounce_saws']);
  const total = Math.min(20, 5 + Math.floor(t * 0.48) + Math.floor(tier * 1.6));

  const INTRO = [
    [1, 'pulse', 'New: pulse spikes. Time your run'],
    [2, 'ice', 'New: ice. Slippery'],
    [3, 'dashgap', 'New: wide gaps. Press DASH in the air', 'Dash passes through bullets and saws'],
    [5, 'crumble', 'New: crumbling floor'], [5, 'conveyor', 'New: conveyor belts'],
    [6, 'bounce', 'New: bounce pads'], [6, 'hmover', 'New: sliding platforms'],
    [7, 'saws', 'New: saw blades. Jump them or dash through'],
    [8, 'shaft', 'New: wall climbs'],
    [10, 'turret', 'New: cannons. Jump the shots'], [10, 'orbs', 'New: orbs refill your jump and dash'],
    [11, 'vsaw', 'New: rising saws. Slip through the gaps'],
    [12, 'lift', 'New: lifts'],
    [13, 'dropper', 'New: ceiling cannons. Watch the glow'], [13, 'vent', 'New: wind vents lift you up'],
    [15, 'gauntlet', 'New: hazard gauntlets'],
    [4, 'tower', 'New: one-way ledges. Jump up through them'], [9, 'boostrun', 'New: boost pads launch you forward'], [12, 'mudpulse', 'New: mud slows you down. Mind the spikes'],
    [17, 'combo_dash_saw', 'Expert unlock: Dash-Saw Gaps'],
    [44, 'orb_saw_gauntlet', 'Master unlock: Orb-Saw Chains'],
    [54, 'crumble_turret', 'Master unlock: Crumble Turret Runs'],
    [64, 'conveyor_spikes', 'Apex unlock: Reverse Belt Gauntlets'],
    [79, 'double_turret_shaft', 'Apex unlock: Guarded Shafts'],
    [99, 'apex_gauntlet', 'Centurion unlock: Apex Gauntlets'],
    [139, 'nightmare_orb_run', 'Nightmare unlock: Void Orb Crossings']
  ];
  const intro = [], forcedAt = {};
  INTRO.filter(e => e[0] === tn).forEach((e, j) => { forcedAt[2 + 2 * j] = e[1]; intro.push(...e.slice(2)); });
  if (mods.length > 1) intro.push('Combo mutator: ' + mods.map(m => m.toUpperCase()).join(' + '));
  else if (hasMod('float')) intro.push('Low gravity level');
  else if (hasMod('double')) intro.push('Bonus level: double jump');
  else if (hasMod('turbo')) intro.push('Turbo level: faster runner');
  else if (hasMod('chase')) intro.push('Chase level: outrun the wall!');
  else if (hasMod('dark')) intro.push('Blackout level: you only see what is close');
  else if (hasMod('slick')) intro.push('Slick level: the whole floor is ice');
  else if (hasMod('nodash')) intro.push('No-dash level: your dash is disabled');
  else if (hasMod('iron')) intro.push('Iron level: no checkpoints');

  let prev = 'flat';
  const segMeta = [];
  const pFlat = tn >= 42 ? 0 : Math.max(0, 0.50 - tn * 0.012);
  const checkInterval = tn >= 25 ? 9999 : Math.max(6, Math.floor(total / 3));
  let nextCheckIdx = hasMod('iron') ? 9999 : Math.max(4, Math.floor(total / 2));
  if (!hasMod('iron') && tn < 25 && total >= 12) nextCheckIdx = checkInterval;

  for (let i = 0; i < total; i++) {
    if (x >= 210) break;
    let name;
    if (forcedAt[i] && gy > 9 && pool.some(p => p[0] === forcedAt[i])) name = forcedAt[i];
    else if (i === nextCheckIdx) name = 'flat';
    else if (hard.has(prev) && pFlat > 0 && rng() < pFlat) name = 'flat';
    else if (gy <= 9) name = 'drop';
    else {
      let guard = 0;
      do {
        let sum = 0; for (const p of pool) sum += p[1];
        let r = rng() * sum; name = pool[0][0];
        for (const p of pool) { r -= p[1]; if (r <= 0) { name = p[0]; break; } }
        guard++;
      } while (guard < 12 && ((name === 'shaft' && shafts >= maxShafts) || (name === 'double_turret_shaft' && shafts >= maxShafts) || (name === 'lift' && lifts >= (t >= 25 ? 2 : 1)) || (name === prev && hard.has(name))));
    }
    const x0 = x;
    S[name]();
    segMeta.push({ name, x0, x1: x });
    if ((name === 'shaft' || name === 'double_turret_shaft') && x > x0) shafts++;
    if (name === 'lift') lifts++;
    if (name === 'flat' && i >= nextCheckIdx && x > x0 + 2) {
      put(x0 + 1, gy - 1, 'K');
      nextCheckIdx = i + checkInterval;
    }
    prev = name;
  }
  ground(x, 9, gy); put(x + 5, gy - 1, 'G');
  // collectible stars floating above the terrain (optional, purely for fun)
  if (segMeta.length) {
    const starN = Math.min(7, 2 + Math.floor(segMeta.length / 4));
    for (let k = 0, tries = 0; k < starN && tries < 80; tries++) {
      const sm = segMeta[Math.floor(rng() * segMeta.length)];
      const sx = R(sm.x0, Math.max(sm.x0, sm.x1 - 1));
      if (!cols[sx]) continue;
      let top = -1;
      for (let yy = 3; yy < H - 2; yy++) if (cols[sx][yy] !== '.') { top = yy; break; }
      if (top < 6) continue;
      // only float stars over firm footing, and only one hop above it (a jump apex is ~3.2 tiles, so top-3 looked and played "too high")
      if ('#iqepmn'.indexOf(cols[sx][top]) < 0) continue;
      const ty = top - 2;
      if (cols[sx][ty] !== '.' || cols[sx][ty - 1] !== '.' || cols[sx][ty - 2] !== '.' || cols[sx][ty + 1] !== '.') continue;
      cols[sx][ty] = '*'; k++;
    }
  }
  const W = x + 9;
  const rows = [];
  for (let y = 0; y < H; y++) { let s = ''; for (let xx = 0; xx < W; xx++) s += (cols[xx] ? cols[xx][y] : '.'); rows.push(s); }
  return {
    name: (chaos ? 'Chaos ' : 'Level ') + n, w: W, h: H, rows, segMeta, intro, mod, mods,
    cfg: {
      chase: hasMod('chase') ? Math.min(5.6, 2.9 + 0.045 * Math.max(0, t - 10) + tier * 0.28) : 0,
      theme: chaos ? THEME_KEYS[(n * 7 + (seed >>> 3)) % THEME_KEYS.length] : THEME_KEYS[Math.floor(tn / 2) % THEME_KEYS.length],
      grav: hasMod('float') ? 0.78 : 1,
      speed: hasMod('turbo') ? 1.14 : 1,
      jumps: hasMod('double') ? 2 : 1,
      wall: true,
      ms,
      dash: !hasMod('nodash'),
      bs,
      bp,
      sawMult,
      dark: hasMod('dark'),
      slick: hasMod('slick')
    }
  };
}

function genLevel(n, seed, chaos) {
  for (let attempt = 0; attempt < 8; attempt++) {
    const sd = (attempt === 0) ? seed : ((seed ^ Math.imul(attempt + 1, 0x9E3779B1)) >>> 0);
    const L = genLevelRaw(n, sd, chaos);
    const v = validateGeneratedLevel(L);
    if (v.ok) return L;
  }
  const fb = buildFallbackLevel(n, seed);
  if (chaos) fb.name = 'Chaos ' + n;
  return fb;
}

function drawSaw(ctx, cx, cy, r, rot, th) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.fillStyle = '#c9ced8'; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.72 : r * 1.12; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = th.spike; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#20232c'; ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, 6.3); ctx.fill();
  ctx.restore();
}

/* ===== shared state: batched sync, version counters, memoization ===== */
const NET = {
  db: null, api: null, uid: null, authToken: null, nick: LS.get('nick', ''),
  mode: LS.get('gameMode', 'time_attack') === 'relay' ? 'relay' : 'time_attack', // anything else saved by an older build falls back
  game: null, relay: { relayLevel: 1, totalClears: 0, milestones: {}, lastRunner: null },
  levelTimes: { levels: {} },
  queue: [], scores: [], levels: [],
  scoresVer: 0, levelsVer: 0,
  gotGame: false, loadErr: false, inLine: false,
  hb: Math.floor(Math.random() * 90000) + 1000,
  handledRev: -1, clockOffset: 0, resuming: false,
  syncBusy: false, syncTimer: 0, lastSyncHashes: {}

const serverNow = () => Date.now() + NET.clockOffset;
const seen = new Map();
const touchSeen = (key, hb) => { const s = seen.get(key); if (!s || s.hb !== hb) seen.set(key, { hb, at: Date.now() }); };

const serial = (k, fn) => { WQ[k] = (WQ[k] || Promise.resolve()).then(fn).catch(e => console.warn('write', k, e && e.code || e)); return WQ[k]; };
const online = () => !!(NET.api && NET.uid) || !!(NET.db && NET.uid);

/* ===== Authenticated HTTP API Client & Shared Batched Sync Loop ===== */
function makeHttpClient() {
  const apiCall = async body => {
    const payload = Object.assign({}, body);
    if (NET.uid && !payload.uid) payload.uid = NET.uid;
    if (NET.authToken && !payload.token) payload.token = NET.authToken;
    const r = await fetch('/api/db', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(() => ({}));
    if (j && typeof j.serverNow === 'number') {
      NET.clockOffset = j.serverNow - Date.now();
    }
    if (!r.ok) throw Object.assign(new Error(j.error || 'request_failed'), { code: j.error || 'unavailable', status: r.status, body: j });
    return j;
  };
  const dsnap = (path, d) => ({ id: path.split('/').pop(), exists: d !== null && d !== undefined, data: () => (d === null ? undefined : d), metadata: {} });
  const docRef = path => ({
    id: path.split('/').pop(), path,
    get: async () => dsnap(path, (await apiCall({ op: 'get', path })).data),
    set: async d => { await apiCall({ op: 'set', path, data: d }); },
    update: async d => { await apiCall({ op: 'update', path, data: d }); },
    delete: async () => { await apiCall({ op: 'delete', path }); }
  });
  const colRef = path => ({
    path, doc: id => docRef(path + '/' + id),
    get: async () => ({ docs: (await apiCall({ op: 'list', path })).rows.map(r => ({ id: r.id, exists: true, data: () => r.data })) })
  });
  return { apiCall, db: { doc: docRef, collection: colRef } };
}

function applySyncPayload(res) {
  if (!res || !res.ok) return;
  let dirty = false;
  const h = NET.lastSyncHashes;

  if (res.state !== undefined) {
    const sj = JSON.stringify(res.state);
    if (sj !== h.state) {
      h.state = sj; NET.game = res.state; NET.gotGame = true; NET.loadErr = false;
      if (NET.game) touchSeen('game', NET.game.hb || 0);
      dirty = true;
    } else if (!NET.gotGame) { NET.gotGame = true; NET.loadErr = false; dirty = true; }
  }
  if (res.relay !== undefined) {
    const rj = JSON.stringify(res.relay);
    if (rj !== h.relay) { h.relay = rj; NET.relay = res.relay; dirty = true; }
  }
  if (res.levelTimes !== undefined) {
    const ltj = JSON.stringify(res.levelTimes);
    if (ltj !== h.levelTimes) { h.levelTimes = ltj; NET.levelTimes = res.levelTimes; dirty = true; }
  }
  if (Array.isArray(res.queue)) {
    const qj = JSON.stringify(res.queue);
    if (qj !== h.queue) {
      h.queue = qj; NET.queue = res.queue;
      for (const q of NET.queue) touchSeen('q:' + q.uid, q.hb || 0);
      NET.inLine = NET.queue.some(q => q.uid === NET.uid);
      dirty = true;
    }
  }
  if (Array.isArray(res.scores)) {
    const scj = JSON.stringify(res.scores);
    if (scj !== h.scores) {
      h.scores = scj; NET.scores = res.scores; NET.scoresVer++;
      const me = NET.scores.find(x => x.uid === NET.uid);
      if (me && NET.nick && me.nick !== NET.nick) {
        me.nick = NET.nick;
        if (NET.api) serial('s', () => NET.api({ op: 'sync_nick', nick: NET.nick }));
      }
      dirty = true;
    }
  }
  if (Array.isArray(res.levels)) {
    const lvj = JSON.stringify(res.levels);
    if (lvj !== h.levels) { h.levels = lvj; NET.levels = res.levels; NET.levelsVer++; dirty = true; }
  }

  onGameChange();
  if (dirty && !G.active) render();
}

async function syncOnce(include) {
  if (!NET.api || NET.syncBusy) return;
  if (typeof document !== 'undefined' && document.hidden && NET.gotGame) return;
  NET.syncBusy = true;
  try {
    const res = await NET.api(include ? { op: 'sync', include } : { op: 'sync' });
    applySyncPayload(res);
  } catch (e) {
    if (!NET.gotGame) { NET.loadErr = true; render(); }
  } finally {
    NET.syncBusy = false;
  }
}

function syncInclude() {
  if (G.active) return ['state', 'relay'];
  NET.syncTick = (NET.syncTick || 0) + 1;
  if (NET.syncTick % 4 === 0) return null; // full refresh every ~10s
  const light = ['state', 'relay', 'queue'];
  if (VIEW === 'ranks') light.push('levelTimes', 'scores');
  else if (VIEW === 'awards' || VIEW === 'locker') light.push('scores');
  else if (VIEW === 'comm') light.push('levels');
  return light;
}
function scheduleSyncLoop() {
  clearTimeout(NET.syncTimer);
  const cadence = G.active ? 4500 : 2500;
  NET.syncTimer = setTimeout(async () => {
    await syncOnce(syncInclude());
    scheduleSyncLoop();
  }, cadence);
}

async function netInit() {
  let db = null, user = null;
  try { if (window.claude && window.claude.use) { db = await window.claude.use('db'); user = await window.claude.use('user'); } } catch (e) { /* offline */ }
  if (!db && !(window.claude && window.claude.use) && location.protocol.startsWith('http')) {
    try {
      const client = makeHttpClient();
      const savedUid = LS.get('uid', null);
      const savedToken = LS.get('authToken', null);
      const authRes = await client.apiCall({ op: 'auth', uid: savedUid, token: savedToken });
      if (authRes && authRes.ok && authRes.uid && authRes.token) {
        NET.uid = authRes.uid;
        NET.authToken = authRes.token;
        LS.set('uid', authRes.uid);
        LS.set('authToken', authRes.token);
        db = client.db;
        NET.api = client.apiCall;
      }
    } catch (e) { /* no backend: stay offline */ }
  }
  NET.db = db;
  if (user) { try { NET.uid = await user.id(); } catch (e) { NET.uid = null; } }
  if (!online()) { render(); return; }

  const timer = setTimeout(() => { if (!NET.gotGame) { NET.loadErr = true; render(); } }, 10000);
  if (NET.api) {
    await syncOnce();
    clearTimeout(timer);
    scheduleSyncLoop();
    if (typeof document !== 'undefined') {
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncOnce();
      });
    }
  } else {
    const fail = e => { console.warn('snapshot', e && e.code); NET.loadErr = true; render(); };
    NET.db.doc('game/state').onSnapshot(s => {
      clearTimeout(timer); NET.gotGame = true; NET.loadErr = false;
      NET.game = s.exists ? s.data() : null;
      if (NET.game) touchSeen('game', NET.game.hb || 0);
      onGameChange(); if (!G.active) render();
    }, fail);
    NET.db.doc('game/relay').onSnapshot(s => { if (s.exists && s.data()) { NET.relay = s.data(); if (!G.active) render(); } }, () => {});
    NET.db.doc('game/level_times').onSnapshot(s => { if (s.exists && s.data()) { NET.levelTimes = s.data(); if (!G.active) render(); } }, () => {});
    NET.db.collection('queue').onSnapshot(s => {
      NET.queue = s.docs.map(d => d.data()).filter(Boolean);
      for (const q of NET.queue) touchSeen('q:' + q.uid, q.hb || 0);
      NET.inLine = NET.queue.some(q => q.uid === NET.uid);
      if (!G.active) render();
    }, fail);
    NET.db.collection('scores').onSnapshot(s => { NET.scores = s.docs.map(d => d.data()).filter(Boolean); NET.scoresVer++; if (!G.active) render(); }, fail);
    NET.db.collection('levels').onSnapshot(s => { NET.levels = s.docs.map(d => d.data()).filter(Boolean); NET.levelsVer++; if (!G.active) render(); }, fail);
  }

  setInterval(netTick, 2500);
  setInterval(heartbeat, 2500);

  const fireDisconnectBeacon = () => {
    const s = G.sess;
    if (!online() || !NET.api || !s || s.mode !== 'run' || s.over || !s.turnToken) return;
    const payload = JSON.stringify({ op: 'disconnect', uid: NET.uid, token: NET.authToken, turnToken: s.turnToken });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/db', new Blob([payload], { type: 'application/json' }));
      } else {
        fetch('/api/db', { method: 'POST', headers: { 'content-type': 'application/json' }, body: payload, keepalive: true }).catch(() => {});
      }
    } catch (e) { /* best effort */ }
  };
  addEventListener('pagehide', fireDisconnectBeacon);
  addEventListener('beforeunload', fireDisconnectBeacon);
}

/* ---- queue & grace period ---- */
function graceLeftMs(st) {
  if (!st || !st.runner || st.done) return 0;
  if (st.graceEndsAt && st.graceEndsAt > 0) return Math.max(0, st.graceEndsAt - serverNow());
  if (st.disconnectedAt && st.disconnectedAt > 0) return Math.max(0, st.disconnectedAt + 10000 - serverNow());
  return 0;
}

  return !!(st.disconnectedAt || (st.graceEndsAt && st.graceEndsAt > 0));
}
function turnOver(st) {
  if (!st || !st.runner || st.done) return true;
  const now = serverNow();
  if (st.endsAt && now > st.endsAt + 1500) return true;
  if (isRunnerDisconnected(st) && graceLeftMs(st) <= 0) return true;
  if (staleFor('game') > 18000) return true;
  return false;
}
function freshQueue() {
  const run = NET.game && !turnOver(NET.game) ? NET.game.runner : null;
  return NET.queue.filter(q => q && q.uid !== run && staleFor('q:' + q.uid) < 25000).sort((a, b) => (a.at - b.at) || (a.uid < b.uid ? -1 : 1));
}
function myPos() { const q = freshQueue(); return q.findIndex(e => e.uid === NET.uid); }

async function joinLine() {
  if (!online()) return;
  if (!NET.nick) { const ok = await askNick(); if (!ok) return; }
  sfx.tick();
  const entry = { uid: NET.uid, nick: NET.nick, mode: NET.mode, tab: TAB, at: serverNow(), hb: ++NET.hb };
  touchSeen('q:' + NET.uid, entry.hb);
  NET.queue = NET.queue.filter(q => q.uid !== NET.uid).concat(entry);
  NET.inLine = true;
  render();
  if (NET.api) {
    await serial('q', () => NET.api({ op: 'queue_join', nick: NET.nick, mode: NET.mode, tab: TAB, hb: entry.hb }));
  } else {
    await serial('q', () => NET.db.doc('queue/' + NET.uid).set(entry));
  }
  toast(`You’re in line (${MODEN[NET.mode]})`);
  netTick();
}
async function leaveLine() {
  if (!online()) return;
  NET.queue = NET.queue.filter(q => q.uid !== NET.uid);
  NET.inLine = false;
  render();
  if (NET.api) await serial('q', () => NET.api({ op: 'queue_leave' }));
  else await serial('q', () => NET.db.doc('queue/' + NET.uid).delete());
  toast('Left the line');
}

function heartbeat() {
  if (!online()) return;
  if (NET.inLine && !(G.sess && G.sess.mode === 'run')) {
    const me = NET.queue.find(q => q.uid === NET.uid);
    if (me) {
      const hb = ++NET.hb;
      touchSeen('q:' + NET.uid, hb);
      if (NET.api) serial('q', () => NET.api({ op: 'queue_join', nick: NET.nick, mode: NET.mode, tab: TAB, hb }));
      else serial('q', () => NET.db.doc('queue/' + NET.uid).set({ uid: NET.uid, nick: NET.nick, mode: NET.mode, tab: TAB, at: me.at, hb }));
    }
  }
  const s = G.sess;
  if (s && s.mode === 'run' && !s.over && s.state) {
    const hb = ++NET.hb;
    touchSeen('game', hb);
    if (NET.api && s.turnToken) {
      serial('g', () => NET.api({ op: 'heartbeat', turnToken: s.turnToken }));
    }
  }
}

/* ---- turn advance ---- */
async function netTick() {
  if (!online()) return;
  dailyFlush();
  if (turnOver(NET.game) && !(G.sess && G.sess.mode === 'run' && !G.sess.over)) {
    if (freshQueue().length || (NET.game && NET.game.runner && !NET.game.done)) {
      setTimeout(advance, Math.random() * 250);
    }
  }
}
let advancing = false;
async function advance() {
  if (advancing || !online() || !NET.api) return;
  advancing = true;
  try {
    const res = await NET.api({ op: 'advance' });
    if (res && res.state) {
      NET.game = res.state;
      touchSeen('game', NET.game.hb || 0);
      if (res.turnToken && res.state.runner === NET.uid) {
        NET.pendingTurnToken = { rev: res.state.rev, token: res.turnToken };
      }
      onGameChange();
      if (!G.active) render();
    }
  } catch (e) { console.warn('advance', e && e.code || e); } finally { advancing = false; }
}

/* ---- runner side (start + auto-resume within 10s grace window) ---- */
async function onGameChange() {
  const st = NET.game;
  if (!st || !st.runner || st.done || turnOver(st)) return;
  if (st.runner === NET.uid && !G.active && !NET.resuming) {
    if (NET.handledRev === st.rev && st.tab === TAB && !isRunnerDisconnected(st)) return;
    NET.resuming = true;
    try {
      let turnToken = (NET.pendingTurnToken && NET.pendingTurnToken.rev === st.rev) ? NET.pendingTurnToken.token : null;
      let activeState = st;
      const wasReconnect = isRunnerDisconnected(st) || (st.tab !== TAB);
      if (!turnToken || wasReconnect) {
        if (NET.api) {
          const res = await NET.api({ op: 'resume', tab: TAB });
          if (!res || !res.ok || !res.turnToken) return;
          turnToken = res.turnToken;
          activeState = res.state;
          NET.game = activeState;
        }
      }
      NET.handledRev = activeState.rev;
      NET.queue = NET.queue.filter(q => q.uid !== NET.uid);
      NET.inLine = false;
      startRun(activeState, turnToken, wasReconnect);
    } catch (e) {
      console.warn('resume/start', e && e.code || e);
    } finally {
      NET.resuming = false;
    }
  }
}

/* ---- Memoized communityPool() & champion() ---- */
let _poolVer = -1, _poolCache = [];
function communityPool() {
  if (_poolVer === NET.levelsVer) return _poolCache;
  _poolVer = NET.levelsVer;
  const out = [];
  for (const d of NET.levels) for (const id in (d.items || {})) {
    const it = d.items[id];
    if (it && it.verified && it.rows) out.push({ ...it, id, author: d.nick || it.author || 'Player', authorId: d.uid });
  }
  _poolCache = out.sort((a, b) => (a.id < b.id ? -1 : 1));
  return _poolCache;

  const c = document.createElement('canvas'); c.width = w * px; c.height = h * px; const x = c.getContext('2d');

    } else {

  if (LAST_HTML.ranks === html) return;
  LAST_HTML.ranks = html;
  el.innerHTML = html;

ACT.rkmode = el => { RK.mode = el.dataset.v; LS.set('rkmode', RK.mode); renderRanks(); };
ACT.rkdur = el => { RK.dur = +el.dataset.v; LS.set('rkdur', RK.dur); renderRanks(); };
ACT.rkper = el => { RK.per = el.dataset.v; LS.set('rkper', RK.per); renderRanks(); };
ACT.rklv = el => { RK.lv = +el.dataset.v; LS.set('rklv', RK.lv); renderRanks(); };
ACT.player = el => {
  const p = NET.scores.find(s => s.uid === el.dataset.uid); if (!p) return;
  const legacyBest = Math.max(0, ...DURS.map(d => (p.best && p.best[String(d)] && p.best[String(d)].n) || 0));

  const rec = (p.recent || []).map(r => `<li><span class="rn">${r.n}</span><div class="rw"><span>${MODEN[r.mode] || 'Time Attack'} · ${DURN[r.dur]}${r.level ? ' · Lv ' + r.level : ''}</span><span class="dim sm">${ago(r.at)}</span></div></li>`).join('');
  const m = openModal(`<h3>${esc(p.nick)}${titleBadgeFor(p.uid)}${champCrown(p.uid)}</h3>${prog}<div class="pbs">${best}</div><div class="eyebrow">Recent runs</div><ul class="rows tight">${rec || '<li class="dim">None yet</li>'}</ul><div class="row end"><button class="btn" data-x="c">Close</button></div>`);
