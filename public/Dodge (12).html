/* ---- Awards (quests + claim) and the Locker (fitting room) ---- */
const AW = { filter: LS.get('awfilter', 'all') };
const LK = { sel: null };
const PREV = { raf: 0, t: 0, last: 0, parts: [], ghosts: [], try: {}, burst: 0, opts: { face: 1, champ: false, showDash: true, dashReady: true, wall: 0 } };
const DEFAULT_IDS = { skin: 'default', trail: 'default', aura: 'none', title: '' };
const SLOT_MAPS = { skin: SKINS, trail: TRAILS, aura: AURAS };
const SLOT_SW = { skin: SKIN_SWATCH, trail: TRAIL_SWATCH, aura: AURA_SWATCH };

// like serial(), but the caller can see failures (so a rejected equip can be rolled back)
const serialStrict = (k, fn) => { const p = (WQ[k] || Promise.resolve()).catch(() => {}).then(fn); WQ[k] = p.catch(() => {}); return p; };

// what the fitting room is showing: worn gear, with anything being tried on laid over it
function previewLook() { return Object.assign(getEquipped(), PREV.try); }

function stopPreviewLoop() {
  if (PREV.raf) { cancelAnimationFrame(PREV.raf); PREV.raf = 0; }
}
function startPreviewLoop() {
  if (PREV.raf || VIEW !== 'locker' || G.active) return;
  PREV.last = performance.now();
  const step = ts => {
    const cv = $('#lkCanvas');
    if (VIEW !== 'locker' || G.active || !cv) { PREV.raf = 0; return; }
    if (document.hidden) { PREV.raf = requestAnimationFrame(step); return; }
    const dt = Math.min(0.05, (ts - PREV.last) / 1000); PREV.last = ts; PREV.t += dt;
    paintPreview(cv, dt);
    PREV.raf = requestAnimationFrame(step);
  };
  PREV.raf = requestAnimationFrame(step);
}

function paintPreview(cv, dt) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(220, cv.clientWidth || 300), H = 188;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext('2d'); if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const look = previewLook();
  const groundY = H - 30;

  // back wall: brushed panels with a soft pool of light behind the runner
  ctx.fillStyle = '#10131a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 23.5; x < W; x += 46) { ctx.moveTo(x, 0); ctx.lineTo(x, groundY); }
  ctx.stroke();
  const cx0 = W * 0.5;
  const sp = ctx.createRadialGradient(cx0, groundY - 40, 6, cx0, groundY - 40, Math.max(120, W * 0.5));
  sp.addColorStop(0, 'rgba(255,200,120,.20)'); sp.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sp; ctx.fillRect(0, 0, W, groundY);

  // floor with hazard trim
  ctx.fillStyle = '#222733'; ctx.fillRect(0, groundY, W, 30);
  ctx.fillStyle = '#566070'; ctx.fillRect(0, groundY, W, 3);
  ctx.fillStyle = 'rgba(255,106,19,.30)';
  for (let x = -10; x < W + 20; x += 26) { ctx.beginPath(); ctx.moveTo(x, groundY + 10); ctx.lineTo(x + 10, groundY + 10); ctx.lineTo(x + 4, groundY + 20); ctx.lineTo(x - 6, groundY + 20); ctx.closePath(); ctx.fill(); }

  const tp = 44, rw = PH.pw * tp, rh = PH.ph * tp;
  const hop = Math.abs(Math.sin(PREV.t * 5.2)) * 4;
  const rx = Math.round(cx0 - rw / 2), ry = Math.round(groundY - rh - hop);

  // trail emitters
  const add = o => { if (PREV.parts.length >= 44) PREV.parts.shift(); PREV.parts.push(o); };
  const tr = look.trail;
  if (tr === 'ghost') { if (Math.random() < 0.3) { if (PREV.ghosts.length >= 10) PREV.ghosts.shift(); PREV.ghosts.push({ x: rx, y: ry, life: 0.34, max: 0.34 }); } }
  else if (tr === 'volt') add({ x: rx + 2, y: ry + Math.random() * rh, vx: -105, vy: (Math.random() - 0.5) * 40, life: 0.34, max: 0.34, c: Math.random() < 0.5 ? '#4ade80' : '#d6ffe6', s: 4 });
  else if (tr === 'ember') add({ x: rx + 4, y: ry + Math.random() * rh, vx: -95 - Math.random() * 35, vy: -25 - Math.random() * 35, life: 0.42, max: 0.42, c: Math.random() < 0.5 ? '#ff5522' : '#ffc83d', s: 4 });
  else if (tr === 'lightning') add({ x: rx + 2, y: ry + Math.random() * rh, vx: -120 + (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 70, life: 0.25, max: 0.25, c: Math.random() < 0.5 ? '#6df0ff' : '#ffffff', s: 4 });
  else if (tr === 'prism') add({ x: rx + 2, y: ry + Math.random() * rh, vx: -95, vy: (Math.random() - 0.5) * 18, life: 0.46, max: 0.46, c: ['#6df0ff', '#ffc83d', '#ff7a1a', '#ffffff'][Math.floor(Math.random() * 4)], s: 5 });
  else if (Math.random() < 0.3) add({ x: rx + 2, y: ry + rh - 4, vx: -80 - Math.random() * 25, vy: -12 - Math.random() * 16, life: 0.3, max: 0.3, c: 'rgba(143,239,255,.75)', s: 4 });

  // one-shot confetti when a reward is claimed
  if (PREV.burst) {
    PREV.burst = 0;
    for (let i = 0; i < 38; i++) {
      const a = Math.random() * 6.283, v = 60 + Math.random() * 150;
      PREV.parts.push({ x: cx0, y: ry + rh / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.9, max: 0.9, c: ['#ffc83d', '#ff7a1a', '#ffffff', '#6df0ff'][i % 4], s: 4, g: 260 });
    }
  }

  for (let i = PREV.ghosts.length - 1; i >= 0; i--) {
    const g = PREV.ghosts[i]; g.life -= dt; g.x -= 110 * dt;
    if (g.life <= 0) { PREV.ghosts.splice(i, 1); continue; }
    ctx.globalAlpha = 0.42 * (g.life / g.max); ctx.fillStyle = '#6df0ff'; ctx.fillRect(g.x, g.y, rw, rh);
  }
  for (let i = PREV.parts.length - 1; i >= 0; i--) {
    const q = PREV.parts[i]; q.life -= dt;
    if (q.life <= 0) { PREV.parts.splice(i, 1); continue; }
    if (q.g) q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.s, q.s);
  }
  ctx.globalAlpha = 1;

  PREV.opts.champ = isChampMe(); PREV.opts.dashReady = true;
  drawRunner(ctx, rx, ry, rw, rh, tp, PREV.t, look, PREV.opts);

  const label = (NET.nick || 'RUNNER').toUpperCase() + (look.title ? ' [' + look.title + ']' : '');
  ctx.font = '700 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = look.title ? GOLD : '#aeb6c6';
  ctx.fillText(label, cx0, 20);
}

function achProgress(a, ach, byType) {
  if (ach[a.id]) { const cnt = Number(ach[a.id].count) || 1; return { pct: 100, text: cnt > 1 ? `DONE · ${cnt}x` : 'DONE' }; }
  const lv = savedLevel();
  if (a.id === 'striker') { const c = Math.min(10, lv); return { pct: Math.round((c / 10) * 100), text: `${c} / 10 LV` }; }
  if (a.id === 'vanguard') { const c = Math.min(25, lv); return { pct: Math.round((c / 25) * 100), text: `${c} / 25 LV` }; }
  if (a.id === 'overdrive') { const c = Math.min(50, lv); return { pct: Math.round((c / 50) * 100), text: `${c} / 50 LV` }; }
  if (a.id === 'centurion') { const c = Math.min(100, lv); return { pct: c, text: `${c} / 100 LV` }; }
  if (a.id === 'immortal') { const c = Math.min(200, lv); return { pct: Math.round((c / 200) * 100), text: `${c} / 200 LV` }; }
  if (a.id === 'saviour') { const c = Math.min(1, byType.saviour || 0); return { pct: c ? 50 : 0, text: c ? 'CLEAR FLAWLESS' : '0 / 1 SAVE' }; }
  if (a.id === 'phantom') { const c = Math.min(5, byType.phantom || 0); return { pct: Math.min(90, c * 18), text: `${byType.phantom || 0} LIFETIME` }; }
  if (a.id === 'razor') { const c = Math.min(3, byType.razor || 0); return { pct: Math.min(90, Math.round((c / 3) * 90)), text: `${byType.razor || 0} LIFETIME` }; }
  if (a.id === 'buzzer') { const c = byType.buzzer || 0; return { pct: c ? 50 : 0, text: `${c} LIFETIME` }; }
  if (a.id === 'clutch_god') {
    const distinct = Object.keys(CLUTCH_INFO).filter(k => (byType[k] || 0) > 0).length;
    return { pct: Math.min(90, Math.round((distinct / 5) * 90)), text: `${distinct} / 5 TYPES` };
  }
  return { pct: 0, text: 'LOCKED' };
}

function clutchByType() {
  const sc = myScoreDoc();
  const remote = (sc && sc.clutches && sc.clutches.byType) || {};
  const out = Object.assign({}, STATS.byClutch || {});
  for (const k of Object.keys(remote)) out[k] = Math.max(out[k] || 0, remote[k] || 0);
  return out;
}

function renderAwards() {
  const el = $('#v-awards'); if (!el) return;
  const ach = myAchievements(), cl = myClaimed();
  const sc = myScoreDoc();
  const byType = clutchByType();
  const clTotal = Math.max(STATS.clutches || 0, (sc && sc.clutches && sc.clutches.total) || 0);
  const doneCount = ACHIEVEMENTS.filter(a => !!ach[a.id]).length;
  const ready = claimableList();

  const claimBar = ready.length ? `<div class="claimbar">
      <div><b>${ready.length} reward${ready.length > 1 ? 's' : ''} ready to claim</b><span>Claimed gear moves into your Locker, ready to wear.</span></div>
      <button class="btn primary" data-act="claim" data-ids="${ready.map(a => a.id).join(',')}">Claim ${ready.length > 1 ? 'all' : 'it'}</button>
    </div>` : '';

  const clutchCard = `<div class="card">
    <div class="eyebrow">Clutch Log · ${clTotal} Lifetime</div>
    <div class="clutch-grid">${Object.entries(CLUTCH_INFO).map(([cid, info]) => `
      <div class="cl-cell">
        <div class="cl-top">${SVG[info.icon] || SVG.bolt}<b>${byType[cid] || 0}</b></div>
        <div class="cl-name">${esc(info.name)}</div>
        <div class="cl-sub">${esc(info.sub)}</div>
      </div>`).join('')}</div>
  </div>`;

  const filterSeg = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${AW.filter === 'all'}" class="${AW.filter === 'all' ? 'on' : ''}" data-act="awfilter" data-v="all">All (${ACHIEVEMENTS.length})</button>
    <button role="tab" aria-selected="${AW.filter === 'unlocked'}" class="${AW.filter === 'unlocked' ? 'on' : ''}" data-act="awfilter" data-v="unlocked">Complete (${doneCount})</button>
    <button role="tab" aria-selected="${AW.filter === 'locked'}" class="${AW.filter === 'locked' ? 'on' : ''}" data-act="awfilter" data-v="locked">To do (${ACHIEVEMENTS.length - doneCount})</button>
  </div>`;

  const list = ACHIEVEMENTS.filter(a => AW.filter === 'all' || (AW.filter === 'unlocked' ? !!ach[a.id] : !ach[a.id]));
  const cards = list.length ? `<div class="achgrid">${list.map(a => {
    const got = !!ach[a.id], claimed = got && !!cl[a.id];
    const prog = achProgress(a, ach, byType);
    const status = claimed ? SVG.check + ' Claimed' : got ? SVG.check + ' Quest complete' : SVG.lock + ' Locked';
    const action = got && !claimed
      ? `<button class="btn primary sm" data-act="claim" data-id="${a.id}">Claim reward</button>`
      : `<button class="linkbtn" data-act="lkOpen" data-slot="${a.slot}" data-id="${esc(a.rid)}">Try it on in the Locker</button>`;
    return `<article class="ach t-${a.tier} ${got ? 'on' : ''} ${got && !claimed ? 'ready' : ''}">
      <div class="ach-top">
        <div class="ach-id">
          <span class="ach-ico">${SVG[a.icon] || SVG.medal}</span>
          <div><div class="ach-name">${esc(a.name)}</div><div class="ach-status">${status}</div></div>
        </div>
        <span class="tier ${a.tier}">${a.tier}</span>
      </div>
      <p class="dim sm">${esc(a.desc)}</p>
      <div class="ach-prog"><div class="ach-bar"><i style="width:${prog.pct}%"></i></div></div>
      <div class="ach-foot"><span class="ach-rew">${esc(a.reward)}</span><span class="ach-pct">${esc(prog.text)}</span></div>
      <div class="ach-act">${action}</div>
    </article>`;
  }).join('')}</div>` : `<div class="card empty"><h3>Nothing in this filter</h3><p class="dim">Pull off clutches and flawless runs on the course to finish quests.</p></div>`;

  const html = `<div class="aw-head">
      <div class="sectionhead"><h2>Awards</h2><p class="dim">Finish a quest, claim the reward, then wear it from the Locker.</p></div>
      <div class="aw-summary">
        <div class="aw-stat"><b>${doneCount}/${ACHIEVEMENTS.length}</b><span>complete</span></div>
        <div class="aw-stat"><b>${clTotal}</b><span>clutches</span></div>
      </div>
    </div>${claimBar}${clutchCard}${filterSeg}${cards}`;

  if (LAST_HTML.awards !== html) { LAST_HTML.awards = html; el.innerHTML = html; }
}

/* ---- Locker helpers ---- */
const achFor = (slot, id) => slot === 'title' ? ACHIEVEMENTS.find(a => a.title === id) : ACHIEVEMENTS.find(a => a.slot === slot && a.rid === id);
function rewardState(slot, id) {
  if (id === DEFAULT_IDS[slot]) return 'owned';
  const a = achFor(slot, id); if (!a) return 'owned';
  const ach = myAchievements(), cl = myClaimed();
  return ach[a.id] ? (cl[a.id] ? 'owned' : 'ready') : 'locked';
}
function rewardName(slot, id) {
  if (slot === 'title') return id ? '[' + id + ']' : 'No title';
  return (SLOT_MAPS[slot] && SLOT_MAPS[slot][id]) || id;
}
const STATE_LABEL = { owned: 'Owned', ready: 'Claim', locked: 'Locked' };

function doorHtml(slot, id, label, sw, idx, eq, look) {
  const st = rewardState(slot, id);
  const worn = st === 'owned' && eq[slot] === id;
  const pick = PREV.try[slot] === id;
  const color = sw && sw !== 'transparent' ? sw : '#566070';
  const stTxt = worn ? 'Worn' : STATE_LABEL[st];
  return `<button class="lk-door s-${st}${worn ? ' worn' : ''}${pick ? ' pick' : ''}" data-act="lkTry" data-slot="${slot}" data-id="${esc(id)}" aria-pressed="${pick}" aria-label="${esc(label)}, ${stTxt}">
    <span class="lk-no">${String(idx + 1).padStart(2, '0')}</span><i class="lk-led"></i>
    <span class="lk-sw sw-${slot}" style="--c:${color}"></span>
    <span class="lk-nm">${esc(label)}</span>
    <span class="lk-st">${st === 'locked' ? SVG.lock : ''}${stTxt}</span>
  </button>`;
}

function lkTray(eq) {
  const sel = LK.sel;
  const tried = Object.keys(PREV.try).length > 0;
  const reset = tried ? `<button class="btn sm" data-act="lkReset">Back to my look</button>` : '';
  if (!sel) return `<div class="lk-tray"><p class="lk-hint">Tap any locker to try it on. Locked gear is look-only until you finish its quest and claim it.</p>${reset ? `<div class="lk-acts">${reset}</div>` : ''}</div>`;
  const { slot, id } = sel;
  const st = rewardState(slot, id), a = achFor(slot, id);
  const ach = myAchievements();
  const slotName = { skin: 'Suit', trail: 'Trail', aura: 'Aura', title: 'Title' }[slot];
  let quest = '', bar = '', acts = '';
  if (a) {
    const prog = achProgress(a, ach, clutchByType());
    quest = `<div class="lk-quest"><b>${esc(a.name)}</b> · ${esc(a.desc)}</div>`;
    bar = `<div class="lk-prog"><div class="lk-bar"><i style="width:${prog.pct}%"></i></div><span>${esc(prog.text)}</span></div>`;
  }
  const worn = st === 'owned' && eq[slot] === id;
  if (st === 'locked') acts = `<span class="lk-hint">Look only. Finish the quest to unlock it.</span><button class="btn sm" data-act="view" data-v="awards">See quest</button>`;
  else if (st === 'ready') acts = `<button class="btn primary" data-act="claim" data-id="${a.id}">Claim reward</button>`;
  else acts = worn ? `<button class="btn" disabled>Worn</button>` : `<button class="btn primary" data-act="equip" data-slot="${slot}" data-id="${esc(id)}">Wear it</button>`;
  return `<div class="lk-tray">
    <div class="lk-name"><span>${slotName}</span>${esc(rewardName(slot, id))}</div>
    ${quest}${bar}
    <div class="lk-acts">${acts}${reset}</div>
  </div>`;
}

function renderLocker() {
  const el = $('#v-locker'); if (!el) return;
  const eq = getEquipped(), look = previewLook(), owned = ownedSet();
  const ready = claimableCount();
  const trying = Object.keys(PREV.try).length > 0;
  const total = ACHIEVEMENTS.length;
  const have = owned.titles.size - 1;

  const section = (slot, title, mapObj) => {
    const ids = Object.keys(mapObj);
    const got = ids.filter(id => rewardState(slot, id) === 'owned').length;
    return `<div class="lk-sec"><div class="lk-sec-h"><span>${title}</span><span>${got}/${ids.length}</span></div>
      <div class="lk-row">${ids.map((id, i) => doorHtml(slot, id, mapObj[id], SLOT_SW[slot][id], i, eq, look)).join('')}</div></div>`;

ACT.edRedo = () => { edRedo(); edSave(true); };
ACT.edZoom = el => { ED.tile = clamp(ED.tile + (+el.dataset.d) * 5, 12, 46); edClamp(); edDraw(); };
ACT.edClear = async () => {
  if (!(await askConfirm('Clear the whole level?', 'Everything is removed except a fresh start and goal. You can undo this.', 'Clear', true))) return;
  edPush(); ED.grid = edTemplate(ED.w, ED.h).map(r => r.map(() => '.')); ED.grid[ED.h - 3][3] = 'S'; ED.grid[ED.h - 3][ED.w - 4] = 'G';
  for (let x = 0; x < ED.w; x++) { ED.grid[ED.h - 2][x] = '#'; ED.grid[ED.h - 1][x] = '#'; }
  edDraw(); edStat(); edSave(true);
};
ACT.edBack = () => { edSave(true); ED.open = false; ED.mounted = false; buildRender(); };
ACT.edSaveBtn = () => edSave(false);
ACT.edTest = () => {
  const err = validateLevel(edLevel()); if (err) { toast(err, 'bad'); return; }
  edSave(true); const L = edLevel(); const h = levelHash(L);
  stageOpen({ mode: 'test', n: 1, cleared: 0, elapsed: 0, won: false, level: L, hash: h, nextLevel() { return L; } });
};
function testCleared(s) {
  ED.verified = s.hash; edSave(true);
  setTimeout(() => { if (G.sess === s) { stageClose(); G.sess = null; goView('build'); toast('Cleared. You can publish this level now.', 'good'); } }, 1200);
}
ACT.edPublish = async () => {
  if (!online()) { toast('Publishing needs an online connection', 'bad'); return; }
  if (!edVerified()) { toast('Clear your level first', 'bad'); return; }
  if (!NET.nick) { if (!(await askNick())) return; }
  const L = edLevel(); const id = ED.id;
  try {
    await serial('l', async () => {
      const ref = NET.db.doc('levels/' + NET.uid); const snap = await ref.get(); const cur = snap.exists ? snap.data() : {};
      const items = Object.assign({}, cur.items);
      if (!items[id] && Object.keys(items).length >= 20) throw { code: 'limit' };
      items[id] = { name: L.name || 'Untitled', w: L.w, h: L.h, rows: L.rows, cfg: L.cfg, at: Date.now(), verified: true };
      if (NET.api) await NET.api({ op: 'levels_set', nick: NET.nick, items });
      else await ref.set({ uid: NET.uid, nick: NET.nick, items });
    });
    sfx.clear(); toast('Published. It can show up as level 5 in runs.', 'good'); edStat(); syncOnce(['levels']);
  } catch (e) { toast(e && e.code === 'limit' ? 'You can share up to 20 levels' : 'Couldn’t publish. Try again.', 'bad'); }
};
async function unpublish(id) {
  if (!online()) return;
  try {
    await serial('l', async () => {
      const ref = NET.db.doc('levels/' + NET.uid); const snap = await ref.get(); if (!snap.exists) return;
      const cur = snap.data(); const items = Object.assign({}, cur.items); delete items[id];
      if (NET.api) await NET.api({ op: 'levels_set', nick: NET.nick || cur.nick, items });
      else await ref.set({ uid: NET.uid, nick: NET.nick || cur.nick, items });
    });
    toast('Removed from community levels'); syncOnce(['levels']);
  } catch (e) { toast('Couldn’t remove it. Try again.', 'bad'); }
}

/* ---- settings sheet ---- */
const OPT = {
  grav: [[0.6, 'Low'], [1, 'Normal'], [1.45, 'Heavy']], speed: [[0.8, 'Slow'], [1, 'Normal'], [1.25, 'Fast']],
  jumps: [[1, 'Single'], [2, 'Double'], [3, 'Triple']], wall: [[true, 'On'], [false, 'Off']], ms: [[1.6, 'Slow'], [2.6, 'Medium'], [3.8, 'Fast']],
  dash: [[true, 'On'], [false, 'Off']], bs: [[4.5, 'Slow'], [6.5, 'Medium'], [9, 'Fast']], dark: [[false, 'Off'], [true, 'On']], slick: [[false, 'Off'], [true, 'On']]
};
function sheetHtml() {
  const seg = (k, label) => `<div class="fld"><label>${label}</label><div class="seg">${OPT[k].map(([v, l]) => `<button class="${ED.cfg[k] === v ? 'on' : ''}" data-set="${k}" data-val="${v}">${l}</button>`).join('')}</div></div>`;
  return `<h3>Level settings</h3>
    <div class="fld"><label>Theme</label><div class="chips">${THEME_KEYS.map(k => `<button class="chip ${ED.cfg.theme === k ? 'on' : ''}" data-set="theme" data-val="${k}"><i style="background:linear-gradient(${THEMES[k].skyT},${THEMES[k].skyB})"></i>${THEMES[k].name}</button>`).join('')}</div></div>
    <div class="fld"><label>Size</label><div class="steps"><div><span>Width ${ED.w}</span><button class="btn sm" data-size="w-8">−</button><button class="btn sm" data-size="w+8">+</button></div><div><span>Height ${ED.h}</span><button class="btn sm" data-size="h-2">−</button><button class="btn sm" data-size="h+2">+</button></div></div></div>
    ${seg('grav', 'Gravity')}${seg('speed', 'Run speed')}${seg('jumps', 'Jumps in the air')}${seg('wall', 'Wall jumps')}${seg('ms', 'Mover speed')}${seg('dash', 'Dash')}${seg('bs', 'Bullet speed')}${seg('dark', 'Blackout')}${seg('slick', 'All ice')}
    <p class="dim sm">Changing physics or tiles means you need to clear the level again before publishing.</p>
    <div class="row end"><button class="btn primary" data-x="c">Done</button></div>`;
}
ACT.edSettings = () => {
  const m = openModal(sheetHtml());
  const sheet = $('.sheet', m.el);
  m.el.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) { m.close(); edSave(true); edStat(); return; }
    const s = e.target.closest('[data-set]'), z = e.target.closest('[data-size]');
    if (s) { const k = s.dataset.set; let v = s.dataset.val; v = k === 'theme' ? v : v === 'true' ? true : v === 'false' ? false : +v; ED.cfg[k] = v; }
    if (z) { const [ax, op, n] = z.dataset.size.match(/([wh])([+-])(\d+)/).slice(1); const d = (op === '+' ? 1 : -1) * +n; edResize(ax === 'w' ? ED.w + d : ED.w, ax === 'h' ? ED.h + d : ED.h); }
    if (s || z) { sheet.innerHTML = sheetHtml(); edDraw(); edStat(); }
  });
};

/* ---- my levels list ---- */
function buildListHtml() {
  const list = mineList();
  const cards = list.map(L => {
    const pub = isPublished(L.id), ver = L.ver && L.ver === levelHash(L);
    WORLD['m' + L.id] = L;
    return `<article class="lv"><img alt="Preview of ${esc(L.name)}" src="${previewUrl(L)}"><div class="lvb">
      <div class="lvt">${esc(L.name || 'Untitled')}</div>
      <div class="row gap wrap"><span class="tag ${pub ? 'good' : ver ? 'ice' : ''}">${pub ? 'Published' : ver ? 'Cleared' : 'Draft'}</span><span class="dim sm">${L.w}×${L.h} · ${esc((THEMES[(L.cfg || {}).theme] || THEMES.dusk).name)}</span></div>
      <div class="row gap wrap"><button class="btn sm primary" data-act="myEdit" data-id="${esc(L.id)}">Edit</button><button class="btn sm" data-act="myPlay" data-id="${esc(L.id)}">Play</button>${pub ? `<button class="btn sm" data-act="myUnpub" data-id="${esc(L.id)}">Unpublish</button>` : ''}<button class="btn sm ghost" data-act="myDel" data-id="${esc(L.id)}">Delete</button></div></div></article>`;
  }).join('');
  return `<div class="sectionhead"><h2>Build</h2><p class="dim">Paint tiles, set the physics, pick a theme and size. Clear your own level once and you can share it. Dying in a run never costs you your place, so build while you wait.</p></div>
    <div class="row gap wrap"><button class="btn primary big" data-act="edNew">New level</button></div>
    ${list.length ? `<div class="lvgrid">${cards}</div>` : `<div class="card empty"><h3>Nothing built yet</h3><p class="dim">Your levels are saved on this device as you edit.</p></div>`}`;
}
ACT.edNew = () => edNew();
ACT.myEdit = el => { const L = mineList().find(x => x.id === el.dataset.id); if (L) edLoad(L); };
ACT.myPlay = el => { const L = mineList().find(x => x.id === el.dataset.id); if (!L || G.active) return; stageOpen({ mode: 'level', n: 1, cleared: 0, elapsed: 0, level: L, nextLevel() { return L; } }); };
ACT.myUnpub = el => unpublish(el.dataset.id);
ACT.myDel = async el => {
  const id = el.dataset.id;
  if (!(await askConfirm('Delete this level?', 'It is removed from this device and from community levels.', 'Delete', true))) return;
  saveMine(mineList().filter(x => x.id !== id)); if (isPublished(id)) unpublish(id); buildRender();
};

/* ---- in-line banner ---- */
function renderLineBar() {
  const b = $('#lineBar'); if (!b) return; const pos = myPos();
  const show = online() && NET.inLine && pos >= 0 && VIEW !== 'play' && !G.active;
  b.hidden = !show; if (!show) return;
  const html = `<div class="in"><span><b>#${pos + 1}</b> in line, about <b data-clock="eta2">${fmt(etaMs(pos))}</b></span><button class="btn sm" data-act="view" data-v="play">Open</button></div>`;
  if (LAST_HTML.lineBar === html) return;
  LAST_HTML.lineBar = html;
  b.innerHTML = html;
}

/* editor keyboard shortcuts (desktop) */
addEventListener('keydown', ev => {
  if (!ED.open || VIEW !== 'build' || G.active || document.querySelector('.modal')) return;
  const t = ev.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); ev.shiftKey ? edRedo() : edUndo(); edSave(true); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); edRedo(); edSave(true); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const n = parseInt(ev.key, 10);
  const order = ['hand', '#', 'i', 'b', 'c', '^', 'm', 'n', 'K', 'S', 'G', '.'];
  let tool = null;
  if (n >= 1 && n <= 9) tool = order[n]; else if (ev.key === '0') tool = '.'; else if (k === 'h') tool = 'hand'; else if (k === 'e') tool = '.';
  if (tool) { const b = document.querySelector('#edTools .tool[data-t="' + (tool === '.' ? 'erase' : tool) + '"]'); if (b) ACT.edTool(b); }
  if (k === '=' || k === '+') ACT.edZoom({ dataset: { d: '1' } }); if (k === '-') ACT.edZoom({ dataset: { d: '-1' } });
  if (k === 't') ACT.edTest();
});

/* ===== boot ===== */
(function () {
  applyTheme(LS.get('theme', 'auto'));
  stageInit();
  const v = LS.get('view', 'play');
  goView(['play', 'build', 'comm', 'ranks', 'awards', 'locker'].includes(v) ? v : 'play');
  renderNow();
  netInit();
})();
</script></body></html>
